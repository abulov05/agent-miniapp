<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AGENT ANALYTICS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #ffffff;
  --bg-elev: #f2f2f7;
  --bg-elev-2: #e5e5ea;
  --border: #c6c6c8;
  --border-soft: #e5e5ea;
  --text: #000000;
  --text-dim: #3c3c43;
  --text-mute: #8e8e93;
  --accent: #007aff;
  --accent-dim: #0066d6;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --purple: #af52de;
  --pink: #ff2d55;
}

html[data-theme="dark"] {
  --bg: #000000;
  --bg-elev: #1c1c1e;
  --bg-elev-2: #2c2c2e;
  --border: #38383a;
  --border-soft: #2c2c2e;
  --text: #ffffff;
  --text-dim: #ebebf5;
  --text-mute: #8e8e93;
  --accent: #0a84ff;
  --accent-dim: #0066d6;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  user-select: none; -webkit-user-select: none;
  transition: background-color 0.3s, color 0.3s;
}

input, textarea { user-select: text; -webkit-user-select: text; }

/* Скрываем скроллбары везде */
::-webkit-scrollbar { width: 0; height: 0; background: transparent; display: none; }
* { scrollbar-width: none; -ms-overflow-style: none; }
.content-wrap::-webkit-scrollbar, .panel-body::-webkit-scrollbar { display: none; width: 0; }

#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}

/* HEADER */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border-soft);
  flex-shrink: 0; z-index: 100;
}
.logo {
  width: 48px; height: 48px; flex-shrink: 0;
  filter: drop-shadow(0 0 6px rgba(96,165,250,0.5));
  animation: logoGlow 2.4s ease-in-out infinite;
}
.logo svg { width: 48px; height: 48px; overflow: visible; }

@keyframes logoGlow {
  0%, 100% { filter: drop-shadow(0 0 4px rgba(96,165,250,0.4)); }
  50% { filter: drop-shadow(0 0 14px rgba(96,165,250,0.9)); }
}

.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--text); }
.brand-sub { font-size: 11px; font-weight: 400; letter-spacing: 0.5px; color: var(--text-mute); margin-top: 1px; }
.header-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 50%;
  color: var(--accent); cursor: pointer;
}
.icon-btn:active { background: rgba(120, 120, 128, 0.16); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }

/* SEARCH */
.search-wrap { padding: 8px 16px 12px; background: var(--bg); flex-shrink: 0; z-index: 90; }
.search-bar {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg-elev);
  border: none; border-radius: 12px;
  padding: 6px 6px 6px 12px;
  min-height: 44px;
}
.search-bar:focus-within { background: var(--bg-elev-2); }
.search-bar > svg { width: 18px; height: 18px; color: var(--text-mute); flex-shrink: 0; stroke-width: 2.5; }
.search-bar input {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: inherit; font-size: 17px;
  padding: 0 2px;
}
.search-bar input::placeholder { color: var(--text-mute); }
.search-submit {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); border: none; border-radius: 50%;
  color: white; cursor: pointer; flex-shrink: 0;
  transition: transform 0.1s;
}
.search-submit:active { transform: scale(0.9); opacity: 0.8; }
.search-submit:disabled { opacity: 0.3; }
.search-submit svg { width: 18px; height: 18px; stroke-width: 3; }

/* CONTENT */
.content-wrap {
  flex: 1; position: relative;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 16px;
  min-height: 0;
}

/* SECTIONS */
.section-title {
  font-size: 13px; font-weight: 600;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 20px 0 8px;
  padding: 0 4px;
}

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card {
  background: var(--bg-elev);
  border-radius: 14px;
  padding: 16px 14px;
  text-align: center;
}
.stat-value { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; margin-bottom: 4px; }
.stat-label { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }

/* QUICK GRID */
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.quick-card {
  background: var(--bg-elev);
  border-radius: 14px;
  padding: 16px 14px;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 10px;
  border: none; text-align: left;
  font-family: inherit; color: var(--text);
  transition: transform 0.1s, background 0.15s;
}
.quick-card:active { transform: scale(0.97); background: var(--bg-elev-2); }
.quick-card-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,122,255,0.12); color: var(--accent);
}
.quick-card-icon.green { background: rgba(52,199,89,0.12); color: var(--green); }
.quick-card-icon.orange { background: rgba(255,149,0,0.12); color: var(--orange); }
.quick-card-icon.purple { background: rgba(175,82,222,0.12); color: var(--purple); }
.quick-card-icon.pink { background: rgba(255,45,85,0.12); color: var(--pink); }
.quick-card-icon.red { background: rgba(255,59,48,0.12); color: var(--red); }
.quick-card-icon svg { width: 20px; height: 20px; stroke-width: 2; }
.quick-card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.quick-card-sub { font-size: 12px; color: var(--text-mute); line-height: 1.3; }

/* LIST */
.list {
  list-style: none;
  background: var(--bg);
  border-radius: 12px;
  overflow: hidden;
  border: 0.5px solid var(--border-soft);
  margin-bottom: 16px;
}
.list-item {
  display: flex; align-items: center; gap: 14px;
  padding: 11px 16px;
  border-bottom: 0.5px solid var(--border-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(0, 122, 255, 0.1);
}
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--bg-elev); }
.list-icon {
  width: 29px; height: 29px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent);
  border-radius: 7px;
  color: white; flex-shrink: 0;
  font-size: 15px;
}
.list-icon svg { width: 18px; height: 18px; stroke-width: 2; }
.list-content { flex: 1; min-width: 0; }
.list-title { font-size: 16px; color: var(--text); margin-bottom: 1px; }
.list-sub { font-size: 13px; color: var(--text-mute); }
.list-chevron { color: var(--text-mute); flex-shrink: 0; opacity: 0.5; font-size: 13px; }
.list-chevron svg { width: 16px; height: 16px; stroke-width: 2.5; }
.list-icon.red { background: var(--red); }
.list-icon.green { background: var(--green); }
.list-icon.orange { background: var(--orange); }
.list-icon.purple { background: var(--purple); }
.list-icon.pink { background: var(--pink); }
.list-icon.gray { background: var(--text-mute); }

/* RESULT */
.result-card {
  background: var(--bg);
  border-radius: 12px;
  overflow: hidden;
  border: 0.5px solid var(--border-soft);
  margin-bottom: 12px;
}
.result-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--border-soft);
}
.result-row:last-child { border-bottom: none; }
.result-icon { width: 22px; height: 22px; flex-shrink: 0; color: var(--accent); margin-top: 1px; }
.result-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.result-content { flex: 1; min-width: 0; }
.result-label { font-size: 13px; color: var(--text-mute); margin-bottom: 1px; }
.result-value { font-size: 16px; color: var(--text); word-break: break-word; }
.result-value.mono { font-family: 'SF Mono', 'Menlo', monospace; font-size: 15px; }
.result-value.accent { color: var(--accent); font-weight: 600; }

/* FORMS */
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 13px; color: var(--text-mute); margin-bottom: 6px; }
.field-input {
  width: 100%; padding: 12px 14px;
  background: var(--bg-elev);
  border: none; border-radius: 10px;
  color: var(--text); font-family: inherit; font-size: 17px;
  outline: none;
}
.field-input:focus { background: var(--bg-elev-2); }
.field-input::placeholder { color: var(--text-mute); }
.field-hint { font-size: 12px; color: var(--text-mute); margin-top: 5px; }

.btn {
  width: 100%; padding: 14px 20px;
  background: var(--accent);
  border: none; border-radius: 12px;
  color: white; font-family: inherit;
  font-size: 16px; font-weight: 600;
  cursor: pointer;
  margin-bottom: 8px;
}
.btn:active { background: var(--accent-dim); transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn.secondary { background: var(--bg-elev); color: var(--accent); }
.btn.danger { background: var(--red); }

/* TOGGLE */
.toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg-elev-2);
  border-radius: 15.5px; cursor: pointer;
  transition: 0.3s;
}
.toggle-slider::before {
  content: ''; position: absolute;
  width: 27px; height: 27px; left: 2px; top: 2px;
  background: white; border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  transition: 0.3s;
}
.toggle input:checked + .toggle-slider { background: #34c759; }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

/* TABS */
.tabs {
  display: flex;
  background: var(--bg);
  border-top: 0.5px solid var(--border-soft);
  padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 2px);
  flex-shrink: 0; z-index: 100;
}
.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px;
  background: transparent; border: none;
  color: var(--text-mute); cursor: pointer;
  font-family: inherit;
  border-radius: 8px;
}
.tab:active { opacity: 0.5; }
.tab.active { color: var(--accent); }
.tab svg { width: 26px; height: 26px; stroke-width: 1.8; }
.tab span { font-size: 10px; font-weight: 500; }

/* TOAST */
.toast-wrap {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
  z-index: 1000;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
  width: calc(100% - 32px); max-width: 340px;
}
.toast {
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px);
  border-radius: 14px;
  font-size: 14px; font-weight: 500;
  color: white; text-align: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  transform: translateY(20px) scale(0.95);
  opacity: 0;
  transition: transform 0.25s, opacity 0.25s;
  pointer-events: auto;
}
.toast.show { transform: translateY(0) scale(1); opacity: 1; }
.toast.error { background: rgba(255, 59, 48, 0.95); }
.toast.ok { background: rgba(52, 199, 89, 0.95); }

/* LOADING */
.loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px; z-index: 9999;
  transition: opacity 0.4s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-logo { width: 90px; height: 90px; }
.loading-text {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 11px; letter-spacing: 3px;
  color: var(--text-mute); text-transform: uppercase;
}
.loading-bar {
  width: 100px; height: 3px;
  background: var(--bg-elev-2);
  border-radius: 2px; overflow: hidden;
}
.loading-bar::after {
  content: ''; display: block;
  width: 40%; height: 100%;
  background: var(--accent);
  animation: loading 1.2s ease-in-out infinite;
}
@keyframes loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

/* LOGO ANIMATIONS */
.logo-rotator {
  transform-origin: 50px 50px;
  animation: logoSpin 3s linear infinite;
}
@keyframes logoSpin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.logo-pulse {
  transform-origin: 58px 58px;
  animation: logoPulse 1.8s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { opacity: 1; transform: scale(1); stroke-width: 2.5; }
  50% { opacity: 0.4; transform: scale(1.25); stroke-width: 1.5; }
}
.logo-triangle {
  stroke-dasharray: 260;
  stroke-dashoffset: 260;
  animation: logoDraw 3s ease-in-out infinite;
}
@keyframes logoDraw {
  0% { stroke-dashoffset: 260; opacity: 0.4; }
  50% { stroke-dashoffset: 0; opacity: 1; }
  100% { stroke-dashoffset: -260; opacity: 0.4; }
}

/* CHART */
.chart-wrap {
  background: var(--bg-elev);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}
.chart-title {
  font-size: 14px; font-weight: 600;
  color: var(--text); margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.chart-canvas-wrap { height: 180px; position: relative; }

/* MODAL */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  z-index: 2000; padding: 20px;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--bg);
  border-radius: 20px;
  width: 100%; max-width: 400px;
  max-height: 85vh; overflow-y: auto;
  padding: 24px;
  animation: modalIn 0.25s ease;
}
@keyframes modalIn {
  from { opacity: 0; transform: scale(0.95); }
  to { opacity: 1; transform: scale(1); }
}
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.modal-desc { font-size: 14px; color: var(--text-mute); margin-bottom: 20px; line-height: 1.5; }

/* PHONE MAP MODAL */
@keyframes slideUp {
  from { transform: translateY(100%); }
  to { transform: translateY(0); }
}
@keyframes pulsePin {
  0% { transform: scale(0.7); opacity: 0.6; }
  100% { transform: scale(1.6); opacity: 0; }
}
#phone-map .leaflet-control-zoom a {
  background: var(--bg) !important;
  color: var(--accent) !important;
  border: none !important;
  width: 36px !important;
  height: 36px !important;
  line-height: 34px !important;
  font-size: 18px !important;
}
#phone-map .leaflet-control-zoom-in { border-radius: 10px 10px 0 0 !important; }
#phone-map .leaflet-control-zoom-out { border-radius: 0 0 10px 10px !important; }
#phone-map .leaflet-popup-content-wrapper {
  background: var(--bg) !important;
  color: var(--text) !important;
  border-radius: 12px !important;
  box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important;
}
#phone-map .leaflet-popup-tip { background: var(--bg) !important; }
#phone-map .leaflet-control-attribution { display: none !important; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="loading-logo">
    <svg viewBox="0 0 100 100">
      <defs>
        <linearGradient id="lgL" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#007aff"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lgL)" stroke-width="1.5" opacity="0.3" stroke-dasharray="20 8" class="logo-rotator"/>
      <g class="logo-rotator">
        <path d="M50 50 L50 4 A46 46 0 0 1 82 18 Z" fill="url(#lgL)" opacity="0.25"/>
        <line x1="50" y1="50" x2="50" y2="4" stroke="url(#lgL)" stroke-width="2" opacity="0.9"/>
      </g>
      <polygon class="logo-triangle" points="50,18 82,78 18,78" fill="none" stroke="url(#lgL)" stroke-width="3" stroke-linejoin="round" pathLength="260"/>
      <circle class="logo-pulse" cx="58" cy="58" r="9" fill="none" stroke="url(#lgL)" stroke-width="2.5"/>
      <circle cx="58" cy="55" r="2.5" fill="url(#lgL)"/>
      <line x1="65" y1="65" x2="72" y2="72" stroke="url(#lgL)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="loading-bar"></div>
  <div class="loading-text">INITIALIZING</div>
</div>

<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="lgH" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#007aff"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lgH)" stroke-width="1.5" opacity="0.3" stroke-dasharray="20 8" class="logo-rotator"/>
        <g class="logo-rotator">
          <path d="M50 50 L50 4 A46 46 0 0 1 82 18 Z" fill="url(#lgH)" opacity="0.25"/>
          <line x1="50" y1="50" x2="50" y2="4" stroke="url(#lgH)" stroke-width="2" opacity="0.9"/>
        </g>
        <polygon points="50,18 82,78 18,78" fill="none" stroke="url(#lgH)" stroke-width="3" stroke-linejoin="round"/>
        <circle class="logo-pulse" cx="58" cy="58" r="9" fill="none" stroke="url(#lgH)" stroke-width="2.5"/>
        <circle cx="58" cy="55" r="2.5" fill="url(#lgH)"/>
        <line x1="65" y1="65" x2="72" y2="72" stroke="url(#lgH)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">AGENT</span>
      <span class="brand-sub">ANALYTICS</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refresh-btn" title="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="Настройки">

}
function toast(msg, type = '') {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.textContent = msg;
  toasts.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000);
}
function vibrate(ms = 10) {
  if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {}
}
function formatNumber(n) {
  if (n == null) return '0';
  return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
}

  try {

    const s = localStorage.getItem('aa_tg_user');
    return s ? JSON.parse(s) : null;
  } catch (e) { return null; }
}
function copyToClipboard(text) {
  try {
    navigator.clipboard.writeText(text).then(() => {
      toast('✅ Скопировано', 'ok');
      vibrate();
    }).catch(() => {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      toast('✅ Скопировано', 'ok');

}

async function apiRequest(path, opts = {}) {

    'ngrok-skip-browser-warning': 'true',
    ...(opts.headers || {})
  };
  const r = await fetch(CONFIG.API_BASE + path, { ...opts, headers });
  if (r.status === 401) throw new Error('Неверный API-токен');
  if (r.status === 403) {
    let d = ''; try { d = (await r.json()).error || ''; } catch (e) {}
    throw new Error(d || 'Доступ запрещён');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function renderChart(activity) {
  const canvas = $('activityChart');
  if (!canvas || !activity || !activity.length || typeof Chart === 'undefined') return;
  if (window._currentChart) { window._currentChart.destroy(); window._currentChart = null; }
  const isDark = currentTheme === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
  window._currentChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: activity.map(x => (x.date || '').slice(5)),
      datasets: [{
        data: activity.map(x => x.count),
        backgroundColor: isDark ? 'rgba(10,132,255,0.6)' : 'rgba(0,122,255,0.6)',
        borderColor: isDark ? '#0a84ff' : '#007aff',
        borderWidth: 0, borderRadius: 4, barThickness: 8
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: '#8e8e93', font: { size: 10 }, maxTicksLimit: 5 } },
        x: { grid: { display: false }, ticks: { color: '#8e8e93', font: { size: 9 }, maxTicksLimit: 8 } }
      }
    }
  });
}

function renderPhoneCheck() {
  contentWrap.innerHTML = `
    <div class="section-title">📱 Проверка номера</div>
    <div class="chart-wrap">
      <div class="field">
        <label class="field-label">Номер телефона</label>
        <input type="tel" class="field-input" id="pc-phone" placeholder="+992901234567" autocomplete="off">
        <div class="field-hint">Покажет страну на карте и оператора</div>
      </div>
      <button class="btn" id="pc-check">📱 Проверить</button>
    </div>
    <div id="pc-result"></div>
    <button class="btn secondary" onclick="renderScreen('home')">← Назад</button>
  `;

  $('pc-check').addEventListener('click', async () => {
    const phone = $('pc-phone').value.trim();
    if (!phone) { toast('Введите номер', 'error'); return; }

    const btn = $('pc-check');
    btn.disabled = true;
    btn.textContent = '⏳ Проверка...';

    try {
      const lookups = await apiGetPhoneLookups().catch(() => []);
      const clean = phone.replace(/[\s\-\(\)]/g, '');
      const found = lookups.find(l => {
        const lclean = (l.phone || '').replace(/[\s\-\(\)]/g, '');
        return lclean === clean || lclean.includes(clean) || clean.includes(lclean);
      });

      let info = null;
      if (found) {
        info = {
          phone: found.phone,
          country: '',
          operator: found.carrier || '',
          region: found.region || '',
          telegram: found.telegram,
          telegram_username: found.telegram_username,
          whatsapp: found.whatsapp,
          source: 'database'
        };
      }

      if (!info) {
        info = await lookupPhoneOnline(phone);
      }

      if (info && info.lat && info.lon) {
        showPhoneMap(info);
      } else if (info) {
        $('pc-result').innerHTML = `
          <div class="result-card">
            <div class="result-row"><div class="result-icon">${I.phone}</div><div class="result-content"><div class="result-label">Номер</div><div class="result-value mono accent">${esc(info.phone)}</div></div></div>
            ${info.country ? `<div class="result-row"><div class="result-icon">${I.globe}</div><div class="result-content"><div class="result-label">Страна</div><div class="result-value">${esc(info.country)}</div></div></div>` : ''}
            ${info.operator ? `<div class="result-row"><div class="result-icon">${I.signal}</div><div class="result-content"><div class="result-label">Оператор</div><div class="result-value">${esc(info.operator)}</div></div></div>` : ''}
          </div>
        `;
      } else {

function closePhoneMap() {
  const m = document.getElementById('phone-map-modal');
  if (m) m.remove();
  if (window._phoneMap) { window._phoneMap.remove(); window._phoneMap = null; }
}

function initPhoneMap(lat, lon, info) {
  if (typeof L === 'undefined') { toast('Карта не загрузилась', 'error'); return; }
  const isDark = currentTheme === 'dark';
  const mapEl = document.getElementById('phone-map');
  if (!mapEl) return;

  const map = L.map('phone-map', {
    zoomControl: false, attributionControl: false,
    center: [lat, lon], zoom: 6, minZoom: 2, maxZoom: 18
  });

  const tileUrl = isDark
    ? 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}'
    : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

  L.tileLayer(tileUrl, { maxZoom: 19, subdomains: 'abcd' }).addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);

  const icon = L.divIcon({
    className: '',
    html: `<div style="position:relative;width:24px;height:24px;">
      <div style="position:absolute;inset:0;border-radius:50%;background:#007aff;border:3px solid white;box-shadow:0 3px 12px rgba(0,122,255,0.5);"></div>
      <div style="position:absolute;inset:-10px;border-radius:50%;border:2px solid #007aff;opacity:0.4;animation:pulsePin 2s ease-out infinite;"></div>
    </div>`,
    iconSize: [24, 24], iconAnchor: [12, 12]
  });

  L.marker([lat, lon], { icon }).addTo(map)
    .bindPopup(`<div style="font-family:-apple-system,sans-serif;padding:4px;">
      <b style="font-size:14px;">${esc(info.flag || '')} ${esc(info.country || '')}</b><br>
      <span style="font-size:12px;color:#8e8e93;">${esc(info.operator || '')}</span>
    </div>`).openPopup();

  window._phoneMap = map;
  setTimeout(() => map.invalidateSize(), 200);
}

function showModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}
function closeModal() {
  document.querySelectorAll('.modal-overlay').forEach(m => m.remove());
}

// ============================================================
// ACTIONS
// ============================================================
function openSettings() {
  showModal(`
    <div class="modal-title">⚙️ Настройки</div>
    <div class="modal-desc">API Токен для доступа к боту</div>
    <div class="field">
      <label class="field-label">API Токен</label>
      <input type="password" class="field-input" id="modal-token" value="${esc(APIFY_TOKEN)}">
      <div class="field-hint">Получить в боте: 🔌 API ТОКЕН</div>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:0.5px solid var(--border-soft);border-bottom:0.5px solid var(--border-soft);margin:12px 0;">
      <div>
        <div style="font-size:16px;color:var(--text);font-weight:600;">Тёмная тема</div>
        <div style="font-size:12px;color:var(--text-mute);">Переключить</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="modal-theme" ${currentTheme === 'dark' ? 'checked' : ''}>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <button class="btn" onclick="saveSettings()">Сохранить</button>
    <button class="btn secondary" onclick="closeModal()">Отмена</button>
  `);
  setTimeout(() => {
    const t = $('modal-theme');
    if (t) t.addEventListener('change', e => applyTheme(e.target.checked ? 'dark' : 'light'));
  }, 50);
}
function saveSettings() {
  const t = $('modal-token');
  if (t) {
    APIFY_TOKEN = t.value.trim() || APIFY_TOKEN;
    localStorage.setItem('aa_token', APIFY_TOKEN);
  }
  closeModal();
  toast('Сохранено', 'ok');
  renderScreen(currentScreen.name, currentScreen.data);
}
function openBot() {
  vibrate();
  const url = 'https://t.me/' + CONFIG.BOT_USERNAME;
  try { window.Telegram?.WebApp?.openTelegramLink(url); }
  catch (e) { window.open(url, '_blank'); }
}
function openMyProfile() {
  const u = getTelegramUser();
  if (!u) { toast('Откройте через Telegram', 'error'); return; }
  searchInput.value = String(u.id);
  handleSearch();
}

// ============================================================
// SEARCH HANDLER
// ============================================================
async function handleSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  searchBtn.disabled = true;
  vibrate(10);

  try {
    const isId = /^\d{5,15}$/.test(q);
    if (isId) {
      const userId = parseInt(q);
      try { await apiGetUser(userId); renderScreen('profile', userId); return; } catch (e) {}
    }

    const users = await apiGetUsers();
    const query = q.toLowerCase().replace('@', '').replace(/[\s\-]/g, '');
    const found = users.filter(u =>
      String(u.user_id).includes(query) ||
      (u.username || '').toLowerCase().includes(query) ||
      ((u.first_name || '') + ' ' + (u.last_name || '')).toLowerCase().includes(query)
    );

    if (found.length === 0) { toast('Ничего не найдено', 'error'); return; }
    if (found.length === 1) { renderScreen('profile', found[0].user_id); return; }

    contentWrap.innerHTML = `
      <div class="section-title">Найдено: ${found.length}</div>
      <ul class="list">
        ${found.slice(0, 50).map(u => `
          <li class="list-item" onclick="renderScreen('profile', ${u.user_id})">
            <div class="list-icon">${I.user}</div>
            <div class="list-content">
              <div class="list-title">${esc(((u.first_name || '') + ' ' + (u.last_name || '')).trim() || 'Без имени')}</div>
              <div class="list-sub">${u.username ? '@' + esc(u.username) : 'ID: ' + u.user_id}</div>
            </div>
            <div class="list-chevron">${I.search}</div>
          </li>`).join('')}
      </ul>
    `;
  } catch (e) {
    toast(e.message || 'Ошибка', 'error');
  } finally {
    searchBtn.disabled = false;
  }
}

// ============================================================
// EVENTS
// ============================================================
searchBtn.addEventListener('click', handleSearch);
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); handleSearch(); }
});
$('refresh-btn').addEventListener('click', () => {
  vibrate();
  renderScreen(currentScreen.name, currentScreen.data);
  toast('Обновлено', 'ok');
});
$('settings-btn').addEventListener('click', openSettings);

// ============================================================
// START
// ============================================================
window.addEventListener('load', () => {
  setTimeout(() => {
    const el = document.getElementById('loading');
    if (el) el.classList.add('hidden');
    setTimeout(() => { const e = document.getElementById('loading'); if (e) e.remove(); }, 500);
    renderScreen('home');
  }, 800);
});

// Экспорт для inline-обработчиков
window.renderScreen = renderScreen;
window.openMyProfile = openMyProfile;
window.openBot = openBot;
window.openSettings = openSettings;
window.handleSearch = handleSearch;
window.buyPlan = buyPlan;
window.buyApi = buyApi;
window.activateTracking = activateTracking;
window.confirmDelete = confirmDelete;
window.closeModal = closeModal;
window.saveSettings = saveSettings;
window.copyToClipboard = copyToClipboard;
window.closePhoneMap = closePhoneMap;
window.searchInput = searchInput;
window.$ = $;
</script>
</body>
</html>
