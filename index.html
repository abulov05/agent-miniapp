<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AGENT ANALYTICS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-logo">
      <svg viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="20" y="42" width="60" height="42" rx="8"/>
        <circle cx="50" cy="24" r="8"/>
        <path d="M50 32v10"/>
        <circle cx="38" cy="62" r="3" fill="white"/>
        <circle cx="62" cy="62" r="3" fill="white"/>
        <path d="M42 72h16"/>
      </svg>
    </div>
    <div class="auth-title">AGENT ANALYTICS</div>
    <div class="auth-sub">Войдите через Telegram — бот пришлёт код подтверждения</div>

    <div class="auth-card">
      <div id="auth-step-1">
        <div class="field">
          <label class="field-label">Telegram ID или @username</label>
          <input type="text" class="field-input" id="auth-identifier" placeholder="710278988 или @username" autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="field-hint">Узнать ID можно у <a href="https://t.me/userinfobot" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600;">@userinfobot</a></div>
        </div>
        <button class="btn" id="auth-get-code-btn" style="margin-top:4px;">📩 Получить код</button>
        <button class="btn secondary" id="auth-open-bot-btn">✈️ Открыть @dev1_robot</button>
      </div>

      <div id="auth-step-2" style="display:none;">
        <div class="field">
          <label class="field-label">Код из Telegram</label>
          <input type="text" class="field-input auth-code-input" id="auth-code" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="off">
          <div class="field-hint">Код отправлен в чат с ботом. Действует 5 минут.</div>
        </div>
        <button class="btn" id="auth-verify-btn" style="margin-top:4px;">✅ Войти</button>
        <button class="btn secondary" id="auth-back-btn">← Назад</button>
      </div>

      <div class="auth-status" id="auth-status"></div>
    </div>

    <div class="auth-hint">
      🔒 Вход безопасен — код генерируется персонально<br>
      и действует только 5 минут
    </div>
  </div>
</div>

<div class="loading" id="loading">
  <div class="loading-logo">
    <svg viewBox="0 0 100 100">
      <defs><linearGradient id="lgL" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#007aff"/></linearGradient></defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lgL)" stroke-width="1.5" opacity="0.3" stroke-dasharray="20 8" class="logo-rotator"/>
      <g class="logo-rotator"><path d="M50 50 L50 4 A46 46 0 0 1 82 18 Z" fill="url(#lgL)" opacity="0.25"/><line x1="50" y1="50" x2="50" y2="4" stroke="url(#lgL)" stroke-width="2" opacity="0.9"/></g>
      <polygon class="logo-triangle" points="50,18 82,78 18,78" fill="none" stroke="url(#lgL)" stroke-width="3" stroke-linejoin="round" pathLength="260"/>
      <circle class="logo-pulse" cx="58" cy="58" r="9" fill="none" stroke="url(#lgL)" stroke-width="2.5"/>
      <circle cx="58" cy="55" r="2.5" fill="url(#lgL)"/>
      <line x1="65" y1="65" x2="72" y2="72" stroke="url(#lgL)" stroke-width="3" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="loading-bar"></div>
  <div class="loading-text" id="loading-text">INITIALIZING</div>
</div>

<div id="app" style="display:none;">
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 100 100">
        <defs><linearGradient id="lgH" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#007aff"/></linearGradient></defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lgH)" stroke-width="1.5" opacity="0.3" stroke-dasharray="20 8" class="logo-rotator"/>
        <g class="logo-rotator"><path d="M50 50 L50 4 A46 46 0 0 1 82 18 Z" fill="url(#lgH)" opacity="0.25"/><line x1="50" y1="50" x2="50" y2="4" stroke="url(#lgH)" stroke-width="2" opacity="0.9"/></g>
        <polygon points="50,18 82,78 18,78" fill="none" stroke="url(#lgH)" stroke-width="3" stroke-linejoin="round"/>
        <circle class="logo-pulse" cx="58" cy="58" r="9" fill="none" stroke="url(#lgH)" stroke-width="2.5"/>
        <circle cx="58" cy="55" r="2.5" fill="url(#lgH)"/>
        <line x1="65" y1="65" x2="72" y2="72" stroke="url(#lgH)" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">AGENT</span>
      <span class="brand-sub">ANALYTICS</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="notif-btn" title="Уведомления" style="color:var(--accent);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <div class="notif-badge" id="notif-badge" style="display:none;">0</div>
      </button>
      <button class="icon-btn" id="refresh-btn" title="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <div class="search-wrap">
    <div class="search-bar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
      <input type="text" id="search-input" placeholder="ID, @username или телефон" autocomplete="off" inputmode="text" enterkeyhint="search">
      <button class="search-submit" id="search-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>

  <div class="content-wrap" id="content-wrap"></div>

  <nav class="tabs">
    <button class="tab active" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg><span>Главная</span></button>
    <button class="tab" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg><span>Поиск</span></button>
    <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg><span>Стата</span></button>
    <button class="tab" data-tab="me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Профиль</span></button>
  </nav>
</div>

<div class="toast-wrap" id="toasts"></div>

<script src="app.js"></script>
</body>
</html>
