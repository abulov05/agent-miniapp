<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>AGENT ANALYTICS</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #ffffff;
  --bg-elev: #f2f2f7;
  --bg-elev-2: #e5e5ea;
  --border: #c6c6c8;
  --border-soft: #e5e5ea;
  --text: #000000;
  --text-dim: #3c3c43;
  --text-mute: #8e8e93;
  --accent: #007aff;
  --accent-dim: #0066d6;
  --green: #34c759;
  --red: #ff3b30;
  --orange: #ff9500;
  --purple: #af52de;
  --pink: #ff2d55;
}

html[data-theme="dark"] {
  --bg: #000000;
  --bg-elev: #1c1c1e;
  --bg-elev-2: #2c2c2e;
  --border: #38383a;
  --border-soft: #2c2c2e;
  --text: #ffffff;
  --text-dim: #ebebf5;
  --text-mute: #8e8e93;
  --accent: #0a84ff;
  --accent-dim: #0066d6;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif;
  font-size: 17px; line-height: 1.3;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  user-select: none; -webkit-user-select: none;
  transition: background-color 0.3s, color 0.3s;
}

input, textarea { user-select: text; -webkit-user-select: text; }

#app {
  position: fixed; inset: 0;
  display: flex; flex-direction: column;
  background: var(--bg);
}

/* HEADER */
.header {
  display: flex; align-items: center; gap: 12px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
  background: var(--bg);
  border-bottom: 0.5px solid var(--border-soft);
  flex-shrink: 0; z-index: 100;
}

.logo { width: 36px; height: 36px; flex-shrink: 0; }
.logo svg { width: 36px; height: 36px; }

.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--text); }
.brand-sub { font-size: 11px; font-weight: 400; letter-spacing: 0.5px; color: var(--text-mute); margin-top: 1px; }

.header-actions { margin-left: auto; display: flex; gap: 6px; }

.icon-btn {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: none; border-radius: 50%;
  color: var(--accent); cursor: pointer;
}
.icon-btn:active { background: rgba(120, 120, 128, 0.16); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }

/* SEARCH */
.search-wrap {
  padding: 8px 16px 12px;
  background: var(--bg);
  flex-shrink: 0; z-index: 90;
}

.search-bar {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-elev);
  border: none; border-radius: 10px;
  padding: 7px 8px 7px 10px;
}
.search-bar:focus-within { background: var(--bg-elev-2); }
.search-bar svg { width: 16px; height: 16px; color: var(--text-mute); flex-shrink: 0; stroke-width: 2.5; }
.search-bar input {
  flex: 1; min-width: 0;
  background: transparent; border: none; outline: none;
  color: var(--text); font-family: inherit; font-size: 17px;
  padding: 0 2px;
}
.search-bar input::placeholder { color: var(--text-mute); }

.search-submit {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent); border: none; border-radius: 50%;
  color: white; cursor: pointer; flex-shrink: 0;
}
.search-submit:active { opacity: 0.7; }
.search-submit:disabled { opacity: 0.3; }
.search-submit svg { width: 12px; height: 12px; stroke-width: 3; }

/* CONTENT */
.content-wrap {
  flex: 1; position: relative;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 0 16px 16px;
  min-height: 0;
}

/* WELCOME */
.welcome {
  text-align: center;
  padding: 40px 20px 30px;
}
.welcome-icon {
  width: 96px; height: 96px;
  margin: 0 auto 20px;
  display: flex; align-items: center; justify-content: center;
  background: linear-gradient(135deg, rgba(0,122,255,0.1), rgba(0,122,255,0.02));
  border-radius: 28px;
}
.welcome-icon svg { width: 56px; height: 56px; }
.welcome-title {
  font-size: 24px; font-weight: 700;
  color: var(--text); margin-bottom: 6px;
  letter-spacing: -0.5px;
}
.welcome-sub {
  font-size: 15px; color: var(--text-mute);
  margin-bottom: 24px; line-height: 1.4;
}

.welcome-hint {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px;
  background: var(--bg-elev);
  border-radius: 20px;
  font-size: 13px; color: var(--text-mute);
  margin-bottom: 12px;
}
.welcome-hint svg { width: 16px; height: 16px; stroke-width: 2; }

/* QUICK GRID */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.quick-card {
  background: var(--bg-elev);
  border-radius: 14px;
  padding: 16px 14px;
  cursor: pointer;
  display: flex; flex-direction: column; gap: 10px;
  border: none; text-align: left;
  font-family: inherit;
  transition: transform 0.1s, background 0.15s;
}
.quick-card:active { transform: scale(0.97); background: var(--bg-elev-2); }

.quick-card-icon {
  width: 36px; height: 36px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,122,255,0.12);
  color: var(--accent);
}
.quick-card-icon.green { background: rgba(52,199,89,0.12); color: var(--green); }
.quick-card-icon.orange { background: rgba(255,149,0,0.12); color: var(--orange); }
.quick-card-icon.purple { background: rgba(175,82,222,0.12); color: var(--purple); }
.quick-card-icon.pink { background: rgba(255,45,85,0.12); color: var(--pink); }
.quick-card-icon.red { background: rgba(255,59,48,0.12); color: var(--red); }
.quick-card-icon svg { width: 20px; height: 20px; stroke-width: 2; }

.quick-card-title {
  font-size: 15px; font-weight: 600;
  color: var(--text);
  margin-bottom: 2px;
}
.quick-card-sub {
  font-size: 12px; color: var(--text-mute);
  line-height: 1.3;
}

/* STATS */
.stats-row {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}

.stat-card {
  background: var(--bg-elev);
  border-radius: 14px;
  padding: 16px 14px;
  text-align: center;
}
.stat-value {
  font-size: 24px; font-weight: 700;
  color: var(--text); letter-spacing: -0.5px;
  margin-bottom: 4px;
}
.stat-label {
  font-size: 11px; color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.5px; font-weight: 500;
}

/* SECTION */
.section-title {
  font-size: 13px; font-weight: 600;
  color: var(--text-mute);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin: 20px 0 8px;
  padding: 0 4px;
}

/* RESULT */
.result-card {
  background: var(--bg);
  border-radius: 12px;
  overflow: hidden;
  border: 0.5px solid var(--border-soft);
}

.result-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 16px;
  border-bottom: 0.5px solid var(--border-soft);
}
.result-row:last-child { border-bottom: none; }

.result-icon {
  width: 22px; height: 22px;
  flex-shrink: 0; color: var(--accent);
  margin-top: 1px;
}
.result-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.result-content { flex: 1; min-width: 0; }

.result-label { font-size: 13px; color: var(--text-mute); margin-bottom: 1px; }
.result-value { font-size: 17px; color: var(--text); word-break: break-word; }
.result-value.mono { font-family: 'SF Mono', 'Menlo', monospace; font-size: 15px; }
.result-value.accent { color: var(--accent); font-weight: 600; }

/* PANELS */
.panel {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  background: var(--bg);
  border-top-left-radius: 14px;
  border-top-right-radius: 14px;
  box-shadow: 0 -20px 60px rgba(0, 0, 0, 0.18);
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 85%;
  display: flex; flex-direction: column;
  z-index: 200;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.panel.open { transform: translateY(0); }

.panel-handle {
  width: 36px; height: 5px;
  background: var(--border);
  border-radius: 3px;
  margin: 8px auto 4px;
  flex-shrink: 0;
}

.panel-header {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 16px 12px;
  flex-shrink: 0;
  border-bottom: 0.5px solid var(--border-soft);
  position: relative;
}

.panel-title {
  font-size: 18px; font-weight: 600;
  color: var(--text); flex: 1; text-align: center;
}

.panel-close {
  position: absolute; right: 16px; top: 50%;
  transform: translateY(-50%);
  width: 30px; height: 30px;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg-elev);
  border: none; border-radius: 50%;
  color: var(--text-mute); cursor: pointer;
}

.panel-body {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
  -webkit-overflow-scrolling: touch;
}

/* FORM */
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 13px; color: var(--text-mute); margin-bottom: 6px; }
.field-input {
  width: 100%; padding: 12px 14px;
  background: var(--bg-elev);
  border: none; border-radius: 10px;
  color: var(--text); font-family: inherit; font-size: 17px;
  outline: none;
}
.field-input:focus { background: var(--bg-elev-2); }
.field-input::placeholder { color: var(--text-mute); }
.field-hint { font-size: 12px; color: var(--text-mute); margin-top: 5px; }

.btn {
  width: 100%; padding: 14px 20px;
  background: var(--accent);
  border: none; border-radius: 12px;
  color: white; font-family: inherit;
  font-size: 17px; font-weight: 600;
  cursor: pointer;
}
.btn:active { background: var(--accent-dim); transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn.secondary { background: var(--bg-elev); color: var(--accent); }
.btn.danger { background: var(--red); }

/* LIST */
.list {
  list-style: none;
  background: var(--bg);
  border-radius: 12px;
  overflow: hidden;
  border: 0.5px solid var(--border-soft);
}

.list-item {
  display: flex; align-items: center; gap: 14px;
  padding: 11px 16px;
  border-bottom: 0.5px solid var(--border-soft);
  cursor: pointer;
  -webkit-tap-highlight-color: rgba(0, 122, 255, 0.1);
}
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--bg-elev); }

.list-icon {
  width: 29px; height: 29px;
  display: flex; align-items: center; justify-content: center;
  background: var(--accent);
  border-radius: 7px;
  color: white; flex-shrink: 0;
}
.list-icon svg { width: 18px; height: 18px; stroke-width: 2; }
.list-content { flex: 1; min-width: 0; }
.list-title { font-size: 17px; color: var(--text); margin-bottom: 1px; }
.list-sub { font-size: 13px; color: var(--text-mute); }
.list-chevron { color: var(--text-mute); flex-shrink: 0; opacity: 0.5; }
.list-chevron svg { width: 16px; height: 16px; stroke-width: 2.5; }

.list-icon.red { background: var(--red); }
.list-icon.green { background: var(--green); }
.list-icon.orange { background: var(--orange); }
.list-icon.purple { background: var(--purple); }
.list-icon.pink { background: var(--pink); }
.list-icon.gray { background: var(--text-mute); }

/* SETTINGS TOGGLE */
.setting-row {
  display: flex; align-items: center;
  justify-content: space-between;
  padding: 14px 0;
  border-bottom: 0.5px solid var(--border-soft);
}
.setting-row:last-child { border-bottom: none; }
.setting-label { font-size: 17px; color: var(--text); }
.setting-desc { font-size: 12px; color: var(--text-mute); margin-top: 2px; }

.toggle {
  position: relative;
  width: 51px; height: 31px;
  flex-shrink: 0;
}
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider {
  position: absolute; inset: 0;
  background: var(--bg-elev-2);
  border-radius: 15.5px;
  cursor: pointer;
  transition: 0.3s;
}
.toggle-slider::before {
  content: '';
  position: absolute;
  width: 27px; height: 27px;
  left: 2px; top: 2px;
  background: white;
  border-radius: 50%;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  transition: 0.3s;
}
.toggle input:checked + .toggle-slider { background: #34c759; }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }

/* TABS */
.tabs {
  display: flex;
  background: var(--bg);
  border-top: 0.5px solid var(--border-soft);
  padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 2px);
  flex-shrink: 0; z-index: 100;
}

.tab {
  flex: 1;
  display: flex; flex-direction: column; align-items: center;
  gap: 2px; padding: 4px;
  background: transparent; border: none;
  color: var(--text-mute); cursor: pointer;
  font-family: inherit;
  border-radius: 8px;
}
.tab:active { opacity: 0.5; }
.tab.active { color: var(--accent); }
.tab svg { width: 26px; height: 26px; stroke-width: 1.8; }
.tab span { font-size: 10px; font-weight: 500; }

/* TOAST */
.toast-wrap {
  position: fixed;
  left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 90px);
  z-index: 1000;
  display: flex; flex-direction: column;
  gap: 8px; pointer-events: none;
  width: calc(100% - 32px);
  max-width: 340px;
}

.toast {
  padding: 12px 16px;
  background: rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(20px);
  border-radius: 14px;
  font-size: 14px; font-weight: 500;
  color: white; text-align: center;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  transform: translateY(20px) scale(0.95);
  opacity: 0;
  transition: transform 0.25s, opacity 0.25s;
  pointer-events: auto;
}
.toast.show { transform: translateY(0) scale(1); opacity: 1; }
.toast.error { background: rgba(255, 59, 48, 0.95); }
.toast.ok { background: rgba(52, 199, 89, 0.95); }

/* LOADING */
.loading {
  position: fixed; inset: 0;
  background: var(--bg);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  z-index: 9999;
  transition: opacity 0.4s;
}
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-logo { width: 90px; height: 90px; }
.loading-text {
  font-family: 'SF Mono', 'Menlo', monospace;
  font-size: 11px; letter-spacing: 3px;
  color: var(--text-mute); text-transform: uppercase;
}
.loading-bar {
  width: 100px; height: 3px;
  background: var(--bg-elev-2);
  border-radius: 2px; overflow: hidden;
}
.loading-bar::after {
  content: ''; display: block;
  width: 40%; height: 100%;
  background: var(--accent);
  animation: loading 1.2s ease-in-out infinite;
}
@keyframes loading {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(350%); }
}

.logo-rotator { transform-origin: 50px 50px; animation: logoSpin 4s linear infinite; }
@keyframes logoSpin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
.logo-pulse { transform-origin: 50px 50px; animation: logoPulse 2s ease-in-out infinite; }
@keyframes logoPulse { 0%, 100% { opacity: 0.9; } 50% { opacity: 0.5; } }
.logo-triangle {
  stroke-dasharray: 260; stroke-dashoffset: 260;
  animation: logoDraw 1.5s cubic-bezier(0.6, 0.05, 0.3, 1) 0.2s forwards;
}
@keyframes logoDraw { to { stroke-dashoffset: 0; } }

/* CHART */
.chart-wrap {
  background: var(--bg-elev);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
}
.chart-title {
  font-size: 14px; font-weight: 600;
  color: var(--text);
  margin-bottom: 12px;
  display: flex; align-items: center; gap: 8px;
}
.chart-title svg { width: 18px; height: 18px; color: var(--accent); stroke-width: 2; }
.chart-canvas-wrap { height: 180px; position: relative; }
</style>
</head>
<body>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="loading-logo">
    <svg viewBox="0 0 100 100">
      <defs>
        <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/>
          <stop offset="100%" stop-color="#007aff"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lg)" stroke-width="1" opacity="0.3"/>
      <g class="logo-rotator">
        <path d="M50 50 L50 4 A46 46 0 0 1 82 18 Z" fill="url(#lg)" opacity="0.15"/>
        <line x1="50" y1="50" x2="50" y2="4" stroke="url(#lg)" stroke-width="1" opacity="0.6"/>
      </g>
      <polygon class="logo-triangle" points="50,18 82,78 18,78" fill="none" stroke="url(#lg)" stroke-width="2.5" stroke-linejoin="round" pathLength="260"/>
      <circle class="logo-pulse" cx="58" cy="58" r="9" fill="none" stroke="url(#lg)" stroke-width="2"/>
      <circle cx="58" cy="55" r="2.5" fill="url(#lg)"/>
      <line x1="65" y1="65" x2="70" y2="70" stroke="url(#lg)" stroke-width="2.5" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="loading-bar"></div>
  <div class="loading-text">INITIALIZING</div>
</div>

<div id="app">

  <!-- HEADER -->
  <header class="header">
    <div class="logo">
      <svg viewBox="0 0 100 100">
        <defs>
          <linearGradient id="lg2" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#60a5fa"/>
            <stop offset="100%" stop-color="#007aff"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="46" fill="none" stroke="url(#lg2)" stroke-width="1" opacity="0.25"/>
        <g class="logo-rotator">
          <path d="M50 50 L50 4 A46 46 0 0 1 82 18 Z" fill="url(#lg2)" opacity="0.12"/>
          <line x1="50" y1="50" x2="50" y2="4" stroke="url(#lg2)" stroke-width="1" opacity="0.5"/>
        </g>
        <polygon points="50,18 82,78 18,78" fill="none" stroke="url(#lg2)" stroke-width="2.5" stroke-linejoin="round"/>
        <circle cx="58" cy="58" r="9" fill="none" stroke="url(#lg2)" stroke-width="2"/>
        <circle cx="58" cy="55" r="2.5" fill="url(#lg2)"/>
        <line x1="65" y1="65" x2="70" y2="70" stroke="url(#lg2)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="brand-text">
      <span class="brand-name">AGENT</span>
      <span class="brand-sub">ANALYTICS</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="refresh-btn" title="Обновить">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <polyline points="23 4 23 10 17 10"/>
          <polyline points="1 20 1 14 7 14"/>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
      <button class="icon-btn" id="settings-btn" title="Настройки">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- SEARCH -->
  <div class="search-wrap">

}

function toast(msg, type = '') {
  const el = document.createElement('div');

function formatNumber(n) {
  if (n == null) return '0';

    }

}

async function apiRequest(path, opts = {}) {
  const headers = {
    'Authorization': 'Bearer ' + APIFY_TOKEN,
    'Content-Type': 'application/json',
    'ngrok-skip-browser-warning': 'true',
    ...(opts.headers || {})
  };
  const r = await fetch(CONFIG.API_BASE + path, { ...opts, headers });
  if (r.status === 401) throw new Error('Неверный API-токен');
  if (r.status === 403) {
    let d = '';
    try { d = (await r.json()).error || ''; } catch (e) {}
    throw new Error(d || 'Доступ запрещён');
  }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

      <div class="chart-canvas-wrap"><canvas id="activityChart"></canvas></div>
    </div>
    <div class="section-title">Топ чатов</div>
    <ul class="list" id="top-chats"><li class="list-item"><div class="list-content"><div class="list-sub">Загрузка...</div></div></li></ul>
    <div class="section-title">Популярные слова</div>
    <ul class="list" id="top-words"><li class="list-item"><div class="list-content"><div class="list-sub">Загрузка...</div></div></li></ul>
  `;

  try {
    const [activity, chats, words] = await Promise.all([
      apiGetActivity().catch(() => []),
      apiGetTopInterlocutors().catch(() => []),
      apiGetWords().catch(() => [])
    ]);

    $('top-chats').innerHTML = chats.length
      ? chats.slice(0, 10).map(c => `
          <li class="list-item">
            <div class="list-icon">${I.msg}</div>
            <div class="list-content">
              <div class="list-title">${esc((c.chat || '').slice(0, 28))}</div>
              <div class="list-sub">${formatNumber(c.messages)} сообщений</div>
            </div>
          </li>`).join('')
      : '<li class="list-item"><div class="list-content"><div class="list-sub">Нет данных</div></div></li>';

    $('top-words').innerHTML = words.length
      ? words.slice(0, 15).map(w => `
          <li class="list-item">
            <div class="list-icon purple">#</div>
            <div class="list-content"><div class="list-title">${esc(w.word)}</div></div>
            <div class="list-chevron">${formatNumber(w.count)}</div>
          </li>`).join('')
      : '<li class="list-item"><div class="list-content"><div class="list-sub">Нет данных</div></div></li>';

    renderChart(activity);
  } catch (e) {
    toast(e.message, 'error');
  }
}

function renderChart(activity) {
  const canvas = $('activityChart');
  if (!canvas || !activity || !activity.length) return;
  if (window._currentChart) { window._currentChart.destroy(); window._currentChart = null; }
  if (typeof Chart === 'undefined') return;

  const isDark = currentTheme === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.05)' : 'rgba(0,0,0,0.05)';
  const textColor = isDark ? '#8e8e93' : '#8e8e93';

  window._currentChart = new Chart(canvas, {
    type: 'bar',
    data: {
      labels: activity.map(x => (x.date || '').slice(5)),
      datasets: [{
        data: activity.map(x => x.count),
        backgroundColor: isDark ? 'rgba(10,132,255,0.6)' : 'rgba(0,122,255,0.6)',
        borderColor: isDark ? '#0a84ff' : '#007aff',
        borderWidth: 0,
        borderRadius: 4,
        barThickness: 8
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, grid: { color: gridColor }, ticks: { color: textColor, font: { size: 10 }, maxTicksLimit: 5 } },
        x: { grid: { display: false }, ticks: { color: textColor, font: { size: 9 }, maxTicksLimit: 8 } }
      }
    }
  });
}

function showResult(title, rows, actions = []) {

    html += `
      <div class="result-row">
        <div class="result-icon">${r.icon || ''}</div>
        <div class="result-content">
          <div class="result-label">${esc(r.label)}</div>
          <div class="result-value ${r.mono ? 'mono' : ''} ${r.accent ? 'accent' : ''}">${r.value}</div>

      </div>
    `;
  });
  html += '</div>';

  $('result-body').innerHTML = html;
  openPanel('panel-result');
}

// ============================================================
// SEARCH HANDLER
// ============================================================
async function handleSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  searchBtn.disabled = true;
  vibrate(10);

  try {
    const isId = /^\d{5,15}$/.test(q);
    const isUsername = q.startsWith('@') && q.length > 1;
    const isPhone = /^\+?\d{10,15}$/.test(q.replace(/[\s\-]/g, ''));

    let targetId = null;
    let user = null;

    if (isId) targetId = parseInt(q);
    else if (isPhone) targetId = null; // ищем в боте

    if (targetId) {
      try { user = await apiGetUser(targetId); }
      catch (e) { /* not found */ }
    }

    if (!user) {
      // ищем среди users
      const users = await apiGetUsers();
      const query = q.toLowerCase().replace('@', '').replace(/[\s\-]/g, '');
      const found = users.filter(u =>
        String(u.user_id).includes(query) ||
        (u.username || '').toLowerCase().includes(query) ||
        ((u.first_name || '') + ' ' + (u.last_name || '')).toLowerCase().includes(query)
      );

      if (found.length === 0) {
        toast('Ничего не найдено', 'error');
        return;
      }
      if (found.length === 1) user = await apiGetUser(found[0].user_id);
      else {
        // показать список
        showResult(`Найдено: ${found.length}`, found.slice(0, 30).map(u => ({
          icon: I.user,
          label: (u.first_name || '') + ' ' + (u.last_name || '') || 'Без имени',
          value: u.username ? '@' + esc(u.username) : 'ID: ' + u.user_id
        })));
        return;
      }
    }

    if (user && !user.error) {
      showResult(`👤 ${user.first_name || ''} ${user.last_name || ''}`.trim(), [
        { icon: I.user,  label: 'ID',         value: user.user_id, mono: true, accent: true },
        { icon: I.user,  label: 'Username',   value: user.username ? '@' + esc(user.username) : '—' },
        { icon: I.info,  label: 'Телефон',    value: user.phone || '—' },
        { icon: I.clock, label: 'Регистрация', value: user.estimated_reg || '—' },
        { icon: I.msg,   label: 'Сообщений',  value: formatNumber((user.comments || []).length) },
        { icon: I.users, label: 'Чатов',      value: formatNumber((user.chats || []).length) },
        { icon: I.bot,   label: 'Бот запущен', value: user.started_bot ? '✅ Да' : '❌ Нет' }
      ]);
    }
  } catch (e) {
    toast(e.message || 'Ошибка', 'error');
  } finally {
    searchBtn.disabled = false;
  }
}

function openMyProfile() {
  const u = getTelegramUser();
  if (!u) { toast('Откройте через Telegram', 'error'); return; }
  searchInput.value = String(u.id);
  handleSearch();
}
