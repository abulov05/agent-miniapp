<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --bg: #ffffff; --bg-elev: #f2f2f7; --bg-elev-2: #e5e5ea; --border: #c6c6c8; --border-soft: #e5e5ea; --text: #000000; --text-dim: #3c3c43; --text-mute: #8e8e93; --accent: #007aff; --accent-dim: #0066d6; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --pink: #ff2d55; }
html[data-theme="dark"] { --bg: #000000; --bg-elev: #1c1c1e; --bg-elev-2: #2c2c2e; --border: #38383a; --border-soft: #2c2c2e; --text: #ffffff; --text-dim: #ebebf5; --text-mute: #8e8e93; --accent: #0a84ff; --accent-dim: #0066d6; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none; transition: background-color 0.3s, color 0.3s; }
input, textarea { user-select: text; -webkit-user-select: text; }
::-webkit-scrollbar { width: 0; height: 0; background: transparent; display: none; }
* { scrollbar-width: none; -ms-overflow-style: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.header { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; background: var(--bg); border-bottom: 0.5px solid var(--border-soft); flex-shrink: 0; z-index: 100; }
.logo { width: 48px; height: 48px; flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(96,165,250,0.5)); animation: logoGlow 2.4s ease-in-out infinite; }
.logo svg { width: 48px; height: 48px; overflow: visible; }
@keyframes logoGlow { 0%, 100% { filter: drop-shadow(0 0 4px rgba(96,165,250,0.4)); } 50% { filter: drop-shadow(0 0 14px rgba(96,165,250,0.9)); } }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--text); }
.brand-sub { font-size: 11px; font-weight: 400; letter-spacing: 0.5px; color: var(--text-mute); margin-top: 1px; }
.header-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 50%; color: var(--accent); cursor: pointer; position: relative; }
.icon-btn:active { background: rgba(120, 120, 128, 0.16); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }
.notif-badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.search-wrap { padding: 8px 16px 12px; background: var(--bg); flex-shrink: 0; z-index: 90; }
.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-elev); border: none; border-radius: 12px; padding: 6px 6px 6px 12px; min-height: 44px; }
.search-bar:focus-within { background: var(--bg-elev-2); }
.search-bar > svg { width: 18px; height: 18px; color: var(--text-mute); flex-shrink: 0; stroke-width: 2.5; }
.search-bar input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 17px; padding: 0 2px; }
.search-bar input::placeholder { color: var(--text-mute); }
.search-submit { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--accent); border: none; border-radius: 50%; color: white; cursor: pointer; flex-shrink: 0; transition: transform 0.1s; }
.search-submit:active { transform: scale(0.9); opacity: 0.8; }
.search-submit:disabled { opacity: 0.3; }
.search-submit svg { width: 18px; height: 18px; stroke-width: 3; }
.content-wrap { flex: 1; position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; min-height: 0; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px; padding: 0 4px; }
.stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--bg-elev); border-radius: 14px; padding: 16px 14px; text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; margin-bottom: 4px; }
.stat-label { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.quick-card { background: var(--bg-elev); border-radius: 14px; padding: 20px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; border: none; text-align: left; font-family: inherit; color: var(--text); transition: transform 0.1s, background 0.15s; min-height: 130px; }
.quick-card:active { transform: scale(0.97); background: var(--bg-elev-2); }
.quick-card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(0,122,255,0.12); color: var(--accent); }
.quick-card-icon.green { background: rgba(52,199,89,0.12); color: var(--green); }
.quick-card-icon.orange { background: rgba(255,149,0,0.12); color: var(--orange); }
.quick-card-icon.purple { background: rgba(175,82,222,0.12); color: var(--purple); }
.quick-card-icon.pink { background: rgba(255,45,85,0.12); color: var(--pink); }
.quick-card-icon.red { background: rgba(255,59,48,0.12); color: var(--red); }
.quick-card-icon svg { width: 24px; height: 24px; stroke-width: 2; }
.quick-card-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.quick-card-sub { font-size: 12px; color: var(--text-mute); line-height: 1.3; }
.list { list-style: none; background: var(--bg); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border-soft); margin-bottom: 16px; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-bottom: 0.5px solid var(--border-soft); cursor: pointer; }
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--bg-elev); }
.list-icon { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; background: var(--accent); border-radius: 7px; color: white; flex-shrink: 0; font-size: 15px; }
.list-icon svg { width: 18px; height: 18px; stroke-width: 2; }
.list-content { flex: 1; min-width: 0; }
.list-title { font-size: 16px; color: var(--text); margin-bottom: 1px; }
.list-sub { font-size: 13px; color: var(--text-mute); }
.list-chevron { color: var(--text-mute); flex-shrink: 0; opacity: 0.5; font-size: 13px; }
.list-chevron svg { width: 16px; height: 16px; stroke-width: 2.5; }
.list-icon.red { background: var(--red); }
.list-icon.green { background: var(--green); }
.list-icon.orange { background: var(--orange); }
.list-icon.purple { background: var(--purple); }
.list-icon.pink { background: var(--pink); }
.list-icon.gray { background: var(--text-mute); }
.result-card { background: var(--bg); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border-soft); margin-bottom: 12px; }
.result-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid var(--border-soft); }
.result-row:last-child { border-bottom: none; }
.result-icon { width: 22px; height: 22px; flex-shrink: 0; color: var(--accent); margin-top: 1px; }
.result-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.result-content { flex: 1; min-width: 0; }
.result-label { font-size: 13px; color: var(--text-mute); margin-bottom: 1px; }
.result-value { font-size: 16px; color: var(--text); word-break: break-word; }
.result-value.mono { font-family: 'SF Mono', 'Menlo', monospace; font-size: 15px; }
.result-value.accent { color: var(--accent); font-weight: 600; }
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 13px; color: var(--text-mute); margin-bottom: 6px; }
.field-input { width: 100%; padding: 12px 14px; background: var(--bg-elev); border: none; border-radius: 10px; color: var(--text); font-family: inherit; font-size: 17px; outline: none; }
.field-input:focus { background: var(--bg-elev-2); }
.field-input::placeholder { color: var(--text-mute); }
.field-hint { font-size: 12px; color: var(--text-mute); margin-top: 5px; }
.btn { width: 100%; padding: 14px 20px; background: var(--accent); border: none; border-radius: 12px; color: white; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
.btn:active { background: var(--accent-dim); transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn.secondary { background: var(--bg-elev); color: var(--accent); }
.btn.danger { background: var(--red); }
.toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--bg-elev-2); border-radius: 15.5px; cursor: pointer; transition: 0.3s; }
.toggle-slider::before { content: ''; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; background: white; border-radius: 50%; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); transition: 0.3s; }
.toggle input:checked + .toggle-slider { background: #34c759; }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
.tabs { display: flex; background: var(--bg); border-top: 0.5px solid var(--border-soft); padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 2px); flex-shrink: 0; z-index: 100; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; background: transparent; border: none; color: var(--text-mute); cursor: pointer; font-family: inherit; border-radius: 8px; }
.tab:active { opacity: 0.5; }
.tab.active { color: var(--accent); }
.tab svg { width: 26px; height: 26px; stroke-width: 1.8; }
.tab span { font-size: 10px; font-weight: 500; }
.toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: calc(100% - 32px); max-width: 340px; }
.toast { padding: 12px 16px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-radius: 14px; font-size: 14px; font-weight: 500; color: white; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); transform: translateY(20px) scale(0.95); opacity: 0; transition: transform 0.25s, opacity 0.25s; pointer-events: auto; }
.toast.show { transform: translateY(0) scale(1); opacity: 1; }
.toast.error { background: rgba(255, 59, 48, 0.95); }
.toast.ok { background: rgba(52, 199, 89, 0.95); }
.loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 9999; transition: opacity 0.4s; }
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-logo { width: 90px; height: 90px; }
.loading-text { font-family: 'SF Mono', 'Menlo', monospace; font-size: 11px; letter-spacing: 3px; color: var(--text-mute); text-transform: uppercase; }
.loading-bar { width: 100px; height: 3px; background: var(--bg-elev-2); border-radius: 2px; overflow: hidden; }
.loading-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--accent); animation: loading 1.2s ease-in-out infinite; }
@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
.logo-rotator { transform-origin: 50px 50px; animation: logoSpin 3s linear infinite; }
@keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.logo-pulse { transform-origin: 58px 58px; animation: logoPulse 1.8s ease-in-out infinite; }
@keyframes logoPulse { 0%, 100% { opacity: 1; transform: scale(1); stroke-width: 2.5; } 50% { opacity: 0.4; transform: scale(1.25); stroke-width: 1.5; } }
.logo-triangle { stroke-dasharray: 260; stroke-dashoffset: 260; animation: logoDraw 3s ease-in-out infinite; }
@keyframes logoDraw { 0% { stroke-dashoffset: 260; opacity: 0.4; } 50% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -260; opacity: 0.4; } }
.chart-wrap { background: var(--bg-elev); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.chart-canvas-wrap { height: 180px; position: relative; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg); border-radius: 20px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; padding: 24px; animation: modalIn 0.25s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.modal-desc { font-size: 14px; color: var(--text-mute); margin-bottom: 20px; line-height: 1.5; }
.hist-item { background: var(--bg-elev); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--accent); }
.hist-item .hist-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mute); margin-bottom: 6px; gap: 8px; }
.hist-item .hist-target { font-size: 14px; color: var(--text); font-family: 'SF Mono', monospace; word-break: break-all; }
.hist-item .hist-summary { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes pulsePin { 0% { transform: scale(0.7); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
#phone-map .leaflet-control-zoom a { background: var(--bg) !important; color: var(--accent) !important; border: none !important; width: 36px !important; height: 36px !important; line-height: 34px !important; font-size: 18px !important; }
#phone-map .leaflet-control-zoom-in { border-radius: 10px 10px 0 0 !important; }
#phone-map .leaflet-control-zoom-out { border-radius: 0 0 10px 10px !important; }
#phone-map .leaflet-popup-content-wrapper { background: var(--bg) !important; color: var(--text) !important; border-radius: 12px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important; }
#phone-map .leaflet-popup-tip { background: var(--bg) !important; }
#phone-map .leaflet-control-attribution { display: none !important; }
.chat-messages { display: flex; flex-direction: column; gap: 12px; }
.chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.4; word-break: break-word; }
.chat-msg.user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
.chat-msg.admin { align-self: flex-start; background: var(--bg-elev); color: var(--text); border-bottom-left-radius: 4px; }
.chat-msg-time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }
.vk-card { background: var(--bg-elev); border-radius: 16px; padding: 14px; display: flex; gap: 14px; align-items: center; border: 1px solid var(--border-soft); margin-bottom: 10px; }
.vk-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 26px; }
.vk-info { flex: 1; min-width: 0; }
.vk-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.vk-meta { font-size: 12px; color: var(--text-mute); margin-bottom: 4px; }
.vk-similarity { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 10px; background: rgba(52,199,89,0.15); color: var(--green); margin-bottom: 6px; }
.vk-link { display: inline-block; font-size: 12px; color: var(--accent); text-decoration: none; background: rgba(0,122,255,0.1); padding: 5px 12px; border-radius: 8px; font-weight: 600; }
.vk-link:active { background: rgba(0,122,255,0.25); }

/* ============== AUTH SCREEN ============== */
#auth-screen {
  position: fixed; inset: 0; z-index: 5000;
  background: var(--bg); overflow-y: auto;
  display: none;
  animation: fadeIn 0.3s ease;
}
.auth-wrap {
  max-width: 420px; margin: 0 auto;
  padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px 40px;
  min-height: 100vh;
  display: flex; flex-direction: column;
  justify-content: center;
}
.auth-logo {
  width: 88px; height: 88px;
  border-radius: 50%;
  background: linear-gradient(135deg, #60a5fa, #007aff);
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 20px;
  box-shadow: 0 8px 32px rgba(0,122,255,0.35);
  animation: logoGlow 2.4s ease-in-out infinite;
}
.auth-logo svg { width: 48px; height: 48px; }
.auth-title {
  font-size: 26px; font-weight: 700;
  text-align: center; margin-bottom: 8px;
  color: var(--text); letter-spacing: -0.5px;
}
.auth-sub {
  font-size: 14px; color: var(--text-mute);
  text-align: center; margin-bottom: 32px;
  line-height: 1.5;
}
.auth-card {
  background: var(--bg-elev);
  border-radius: 18px;
  padding: 20px;
}
.auth-card .field { margin-bottom: 12px; }
.auth-card .field:last-child { margin-bottom: 0; }
.auth-code-input {
  text-align: center !important;
  font-size: 32px !important;
  letter-spacing: 14px !important;
  font-family: 'SF Mono', 'Menlo', monospace !important;
  font-weight: 700 !important;
  padding-left: 24px !important;
  color: var(--accent) !important;
}
.auth-status {
  margin-top: 16px;
  font-size: 13px;
  text-align: center;
  min-height: 20px;
  line-height: 1.4;
}
.auth-status.ok { color: var(--green); }
.auth-status.err { color: var(--red); }
.auth-hint {
  text-align: center;
  font-size: 12px;
  color: var(--text-mute);
  margin-top: 20px;
  line-height: 1.5;
}
.auth-hint a { color: var(--accent); text-decoration: none; font-weight: 600; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-wrap">
    <div class="auth-logo">
      <svg viewBox="0 0 100 100" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="20" y="42" width="60" height="42" rx="8"/>
        <circle cx="50" cy="24" r="8"/>
        <path d="M50 32v10"/>
        <circle cx="38" cy="62" r="3" fill="white"/>
        <circle cx="62" cy="62" r="3" fill="white"/>
        <path d="M42 72h16"/>
      </svg>
    </div>
    <div class="auth-title">AGENT ANALYTICS</div>
    <div class="auth-sub">Войдите через Telegram — бот пришлёт код подтверждения</div>

    <div class="auth-card">
      <!-- ШАГ 1: ВВОД ID ИЛИ USERNAME -->
      <div id="auth-step-1">
        <div class="field">
          <label class="field-label">Telegram ID или @username</label>
          <input type="text" class="field-input" id="auth-identifier" placeholder="710278988 или @username" autocomplete="off" autocapitalize="off" spellcheck="false">
          <div class="field-hint">
            Узнать ID можно у <a href="https://t.me/userinfobot" target="_blank" style="color:var(--accent);text-decoration:none;font-weight:600;">@userinfobot</a>
          </div>
        </div>
        <button class="btn" id="auth-get-code-btn" style="margin-top:4px;">📩 Получить код</button>
        <button class="btn secondary" id="auth-open-bot-btn">✈️ Открыть @dev1_robot</button>
      </div>

      <!-- ШАГ 2: ВВОД КОДА -->
      <div id="auth-step-2" style="display:none;">
        <div class="field">
          <label class="field-label">Код из Telegram</label>
          <input type="text" class="field-input auth-code-input" id="auth-code" placeholder="000000" inputmode="numeric" maxlength="6" autocomplete="off">
          <div class="field-hint">Код отправлен в чат с ботом. Действует 5 минут.</div>
        </div>
        <button class="btn" id="auth-verify-btn" style="margin-top:4px;">✅ Войти</button>
        <button class="btn secondary" id="auth-back-btn">← Назад</button>
      </div>

      <div class="auth-status" id="auth-status"></div>
    </div>

    <div class="auth-hint">
      🔒 Вход безопасен — код генерируется персонально<br>
      и действует только 5 минут
    </div>
  </div>
</div>

<div class="loading" id="loading">
  <div class="loading-logo">

}

// ============================================================
// NAVIGATION
// ============================================================
function renderScreen(name, data) {
  if (name === 'admin' && !isAdmin()) { toast('❌ Доступ запрещён', 'error'); return renderHome(); }
  currentScreen = { name, data };
  contentWrap.scrollTop = 0;
  switch (name) {
    case 'home':          return renderHome();
    case 'search':        return renderSearchTab();
    case 'stats':         return renderStats();
    case 'me':            return renderMe();
    case 'profile':       return renderProfile(data);
    case 'phone-check':   return renderPhoneCheck();
    case 'subscription':  return renderSubscription();
    case 'tracking':      return renderTracking();
    case 'delete-data':   return renderDeleteData();
    case 'about':         return renderAbout();
    case 'history':       return renderSearchHistory();
    case 'api-tokens':    return renderApiTokens();
    case 'referral':      return renderReferral();
    case 'bonus':         return renderBonus();
    case 'notifications': return renderNotifications();
    case 'support':       return renderSupport();
    case 'maryam':        return renderMaryam();
    case 'msg-search':    return renderMsgSearch();
    case 'username-check':return renderUsernameCheck();
    case 'hidden-phone':  return renderHiddenPhone();
    case 'photo-search':  return renderPhotoSearch();
    case 'admin':         return renderAdminPanel();
    default:              return renderHome();
  }
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    const t = tab.dataset.tab;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === tab));
    vibrate(8);
    currentTab = t;
    if (t === 'home')        renderScreen('home');
    else if (t === 'search') renderScreen('search');
    else if (t === 'stats')  renderScreen('stats');
    else if (t === 'me')     renderScreen('me');
  });
});

function renderPhotoSearch() {
  contentWrap.innerHTML = `
    <div class="section-title">📸 Поиск по фото (Google Lens)</div>

    <div class="chart-wrap">
      <div class="field">
        <label class="field-label">Загрузите фото</label>
        <input type="file" id="ps-file" accept="image/*" style="display:none;">
        <button class="btn secondary" id="ps-choose" style="margin-bottom:8px;">📁 Выбрать фото</button>
        <div id="ps-size-info" style="font-size:11px;color:var(--text-mute);margin-bottom:8px;text-align:center;"></div>
        <div id="ps-preview" style="text-align:center;margin-top:12px;"></div>
      </div>
      <button class="btn" id="ps-btn" disabled style="background:linear-gradient(135deg,#4285F4,#EA4335);">🔍 Искать через Google Lens</button>
    </div>

    <div class="chart-wrap" style="background:rgba(66,133,244,0.08);border:1px solid rgba(66,133,244,0.2);">
      <div style="color:#4285F4;font-weight:600;margin-bottom:8px;">ℹ️ Как это работает</div>
      <div style="font-size:13px;color:var(--text-dim);line-height:1.6;">
        Бот отправляет фото в <b>Google Lens</b> через Apify. Находит похожие изображения, профили соцсетей (включая ВКонтакте), товары и страницы, где встречается это фото.
        <br><br>
        ⚠️ <b>Совет:</b> чёткое лицо анфас даёт лучшие результаты.
      </div>
    </div>

    <div id="ps-results"></div>

    <button class="btn secondary" onclick="renderScreen('home')">← На главную</button>
  `;

  let imageData = null;

  $('ps-choose').addEventListener('click', () => $('ps-file').click());

  $('ps-file').addEventListener('change', e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) { toast('Выберите изображение', 'error'); return; }

    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => {
        const MAX_SIZE = 800;
        let w = img.width, h = img.height;
        if (w > h && w > MAX_SIZE) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
        else if (h > MAX_SIZE) { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }

        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        imageData = canvas.toDataURL('image/jpeg', 0.75);
        const sizeKb = Math.round((imageData.length * 3 / 4) / 1024);

        $('ps-preview').innerHTML = `<img src="${imageData}" style="max-width:200px;max-height:200px;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,0.4);border:2px solid #4285F4;">`;
        $('ps-size-info').textContent = `Сжато: ${w}×${h}px · ${sizeKb} КБ`;
        $('ps-btn').disabled = false;
      };
      img.onerror = () => toast('Не удалось загрузить фото', 'error');
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  $('ps-btn').addEventListener('click', async () => {
    if (!imageData) { toast('Выберите фото', 'error'); return; }

    const sizeBytes = imageData.length * 3 / 4;
    if (sizeBytes > 1500 * 1024) {
      toast('Фото слишком большое: ' + Math.round(sizeBytes / 1024) + ' КБ', 'error');
      return;
    }

    const btn = $('ps-btn');
    btn.disabled = true;
    btn.textContent = '⏳ Поиск через Google Lens...';

    $('ps-results').innerHTML = `
      <div class="chart-wrap" style="text-align:center;">
        <div class="loading-bar" style="margin:0 auto 12px;"></div>
        <div style="font-size:13px;color:var(--text-mute);">Отправляем фото в Google Lens...<br>Это может занять 15-40 секунд</div>
      </div>
    `;

    try {
      const data = await pubPost('/api/google_lens_search', { image: imageData });

      if (!data.success) {
        $('ps-results').innerHTML = `
          <div class="chart-wrap" style="text-align:center;color:var(--red);">
            ❌ ${esc(data.error || 'Ошибка поиска')}
          </div>
        `;
        return;
      }

      const results = data.results || [];

      if (!results.length) {
        $('ps-results').innerHTML = `
          <div class="chart-wrap" style="text-align:center;">
            <div style="font-size:40px;margin-bottom:8px;">🔍</div>
            <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;">Ничего не найдено</div>

          </div>
        `;

      }

      $('ps-results').innerHTML = `
        <div class="section-title">🎯 Найдено: ${results.length}</div>
        ${results.map(r => `
          <div class="vk-card">
            ${r.thumbnail ? `<img class="vk-avatar" src="${esc(r.thumbnail)}" onerror="this.style.display='none';">` : `<div class="vk-avatar">🔍</div>`}
            <div class="vk-info">

              ${r.source && r.source !== 'web' && r.source !== 'visual' ? `<div class="vk-similarity">${esc(r.source)}</div>` : ''}
              ${r.description ? `<div class="vk-meta">${esc(r.description)}</div>` : ''}
              ${r.url ? `<a class="vk-link" href="${esc(r.url)}" target="_blank">🔗 Открыть</a>` : ''}
            </div>
          </div>
        `).join('')}
      `;
      vibrate(50);
      toast('✅ Найдено: ' + results.length, 'ok');
    } catch(e) {

        <div class="chart-wrap" style="text-align:center;color:var(--red);">
          ❌ Ошибка сети: ${esc(e.message)}

      btn.textContent = '🔍 Искать через Google Lens';
    }
  });
}

function loadProfileAvatar(userId) {

function initPhoneMap(lat, lon, info) {
  if (typeof L === 'undefined') { toast('Карта не загрузилась', 'error'); return; }

  const mapEl = document.getElementById('phone-map');
  if (!mapEl) return;
  const map = L.map('phone-map', { zoomControl: false, attributionControl: false, center: [lat, lon], zoom: 6, minZoom: 2, maxZoom: 18 });
  const tileUrl = isDark ? 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}' : 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
  const tile = L.tileLayer(tileUrl, { maxZoom: 19, subdomains: isDark ? '' : 'abc', attribution: '' });
  tile.on('tileerror', function() { map.removeLayer(tile); const fallback = isDark ? 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' : 'https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png'; L.tileLayer(fallback, { maxZoom: 19, subdomains: 'abcd' }).addTo(map); });
  tile.addTo(map);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  const icon = L.divIcon({ className: '', html: '<div style="position:relative;width:28px;height:28px;"><div style="position:absolute;inset:0;border-radius:50%;background:#007aff;border:3px solid white;box-shadow:0 3px 12px rgba(0,122,255,0.6);"></div><div style="position:absolute;inset:-12px;border-radius:50%;border:2px solid #007aff;opacity:0.5;animation:pulsePin 2s ease-out infinite;"></div></div>', iconSize: [28, 28], iconAnchor: [14, 14] });
  L.marker([lat, lon], { icon }).addTo(map).bindPopup('<div style="font-family:-apple-system,sans-serif;padding:4px;"><b style="font-size:14px;">' + esc(info.flag || '') + ' ' + esc(info.country || '') + '</b><br><span style="font-size:12px;color:#8e8e93;">' + esc(info.operator || '') + '</span></div>').openPopup();
  window._phoneMap = map;
  setTimeout(() => map.invalidateSize(), 250);
}

async function buyPlan(planKey, planLabel, priceUsd) {

  contentWrap.innerHTML = `<div class="section-title">👀 Отслеживание</div><div class="result-card"><div class="result-row"><div class="result-icon">${I.gem}</div><div class="result-content"><div class="result-label">Баланс</div><div class="result-value accent">${me.diamonds ?? '—'} алмазов</div></div></div></div><div class="chart-wrap"><div class="field"><label class="field-label">ID</label><input type="number" class="field-input" id="tr-id" placeholder="123456789"></div><button class="btn" id="tr-btn">👀 Активировать</button></div><div class="section-title">📋 Активные</div><ul class="list">${trackList && trackList.length ? trackList.map(t => `<li class="list-item"><div class="list-icon purple">👤</div><div class="list-content"><div class="list-title">${t.target_user_id}</div><div class="list-sub">до ${(t.end_date||'').slice(0,10)}</div></div><button class="icon-btn" onclick="removeTracking(${t.target_user_id})" style="color:var(--red);">✕</button></li>`).join('') : '<li class="list-item"><div class="list-content"><div class="list-sub">Нет активных</div></div></li>'}</ul><button class="btn secondary" onclick="renderScreen('home')">← Назад</button>`;

async function activateTracking() {
  const u = getTelegramUser(); const id = $('tr-id').value.trim();
  if (!u) { toast('Откройте через Telegram', 'error'); return; }
  if (!id || !/^\d+$/.test(id)) { toast('Введите ID', 'error'); return; }
  const btn = $('tr-btn'); btn.disabled = true; btn.textContent = '⏳...';
  try {
    const data = await pubPost('/api/tracking/add', { user_id: u.id, target_id: parseInt(id) });
    if (data.success) { toast('✅ Активировано!', 'ok'); _meCache = { userId: null, data: null, ts: 0 }; renderScreen('tracking'); }
    else toast('❌ ' + (data.error || 'Ошибка'), 'error');
  } catch(e) { toast('Ошибка', 'error'); }
  finally { btn.disabled = false; btn.textContent = '👀 Активировать'; }
}
async function removeTracking(targetId) {

function showModal(html) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal">' + html + '</div>';
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
}
function closeModal() { document.querySelectorAll('.modal-overlay').forEach(m => m.remove()); }
function openSettings() {
  showModal('<div class="modal-title">⚙️ Настройки</div><div class="field"><label class="field-label">API Токен</label><input type="password" class="field-input" id="modal-token" value="' + esc(APIFY_TOKEN) + '"></div><div style="display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-top:0.5px solid var(--border-soft);border-bottom:0.5px solid var(--border-soft);margin:12px 0;"><div style="font-size:16px;color:var(--text);font-weight:600;">Тёмная тема</div><label class="toggle"><input type="checkbox" id="modal-theme" ' + (currentTheme === 'dark' ? 'checked' : '') + '><span class="toggle-slider"></span></label></div><button class="btn" onclick="saveSettings()">Сохранить</button><button class="btn danger" onclick="closeModal();logout();" style="margin-top:4px;">🚪 Выйти из аккаунта</button><button class="btn secondary" onclick="closeModal()">Отмена</button>');
  setTimeout(() => { const t = $('modal-theme'); if (t) t.addEventListener('change', e => applyTheme(e.target.checked ? 'dark' : 'light')); }, 50);
}
function saveSettings() {
  const t = $('modal-token');
  if (t) { APIFY_TOKEN = t.value.trim() || APIFY_TOKEN; localStorage.setItem('aa_token', APIFY_TOKEN); }
  closeModal(); toast('Сохранено', 'ok'); renderScreen(currentScreen.name, currentScreen.data);
}
async function openMyProfile() {
  const u = getTelegramUser();
  if (!u) { toast('Откройте через Telegram', 'error'); return; }
  const limitCheck = await checkAndUseRequest();
  if (!limitCheck.ok) { showLimitModal(); return; }
  searchInput.value = String(u.id); handleSearch();
}
async function handleSearch() {
  const q = searchInput.value.trim();
  if (!q) return;
  const limitCheck = await checkAndUseRequest();
  if (!limitCheck.ok) { showLimitModal(); return; }
  searchBtn.disabled = true; vibrate(10);
  try {
    const isId = /^\d{5,15}$/.test(q);
    if (isId) { const userId = parseInt(q); try { await apiGetUser(userId); renderScreen('profile', userId); return; } catch (e) {} }
    const users = await apiGetUsers();
    const query = q.toLowerCase().replace('@', '').replace(/[\s\-]/g, '');
    const found = users.filter(u => String(u.user_id).includes(query) || (u.username || '').toLowerCase().includes(query) || ((u.first_name || '') + ' ' + (u.last_name || '')).toLowerCase().includes(query));
    if (found.length === 0) { toast('Ничего не найдено', 'error'); return; }
    if (found.length === 1) { renderScreen('profile', found[0].user_id); return; }
    contentWrap.innerHTML = '<div class="section-title">Найдено: ' + found.length + '</div><ul class="list">' + found.slice(0, 50).map(u => '<li class="list-item" onclick="renderScreen(\'profile\', ' + u.user_id + ')"><div class="list-icon">' + I.user + '</div><div class="list-content"><div class="list-title">' + esc(((u.first_name || '') + ' ' + (u.last_name || '')).trim() || 'Без имени') + '</div><div class="list-sub">' + (u.username ? '@' + esc(u.username) : 'ID: ' + u.user_id) + '</div></div><div class="list-chevron">' + I.search + '</div></li>').join('') + '</ul>';
  } catch (e) { toast(e.message || 'Ошибка', 'error'); }
  finally { searchBtn.disabled = false; }
}

searchBtn.addEventListener('click', handleSearch);
searchInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); handleSearch(); } });
