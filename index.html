<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root { --bg: #ffffff; --bg-elev: #f2f2f7; --bg-elev-2: #e5e5ea; --border: #c6c6c8; --border-soft: #e5e5ea; --text: #000000; --text-dim: #3c3c43; --text-mute: #8e8e93; --accent: #007aff; --accent-dim: #0066d6; --green: #34c759; --red: #ff3b30; --orange: #ff9500; --purple: #af52de; --pink: #ff2d55; }
html[data-theme="dark"] { --bg: #000000; --bg-elev: #1c1c1e; --bg-elev-2: #2c2c2e; --border: #38383a; --border-soft: #2c2c2e; --text: #ffffff; --text-dim: #ebebf5; --text-mute: #8e8e93; --accent: #0a84ff; --accent-dim: #0066d6; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; font-size: 17px; line-height: 1.3; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; user-select: none; -webkit-user-select: none; transition: background-color 0.3s, color 0.3s; }
input, textarea { user-select: text; -webkit-user-select: text; }
::-webkit-scrollbar { width: 0; height: 0; background: transparent; display: none; }
* { scrollbar-width: none; -ms-overflow-style: none; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.header { display: flex; align-items: center; gap: 12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px; background: var(--bg); border-bottom: 0.5px solid var(--border-soft); flex-shrink: 0; z-index: 100; }
.logo { width: 48px; height: 48px; flex-shrink: 0; filter: drop-shadow(0 0 6px rgba(96,165,250,0.5)); animation: logoGlow 2.4s ease-in-out infinite; }
.logo svg { width: 48px; height: 48px; overflow: visible; }
@keyframes logoGlow { 0%, 100% { filter: drop-shadow(0 0 4px rgba(96,165,250,0.4)); } 50% { filter: drop-shadow(0 0 14px rgba(96,165,250,0.9)); } }
.brand-text { display: flex; flex-direction: column; line-height: 1.1; }
.brand-name { font-size: 15px; font-weight: 600; letter-spacing: 0.3px; color: var(--text); }
.brand-sub { font-size: 11px; font-weight: 400; letter-spacing: 0.5px; color: var(--text-mute); margin-top: 1px; }
.header-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: transparent; border: none; border-radius: 50%; color: var(--accent); cursor: pointer; position: relative; }
.icon-btn:active { background: rgba(120, 120, 128, 0.16); }
.icon-btn svg { width: 22px; height: 22px; stroke-width: 2; }
.notif-badge { position: absolute; top: 2px; right: 2px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--red); color: white; font-size: 10px; font-weight: 700; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
.search-wrap { padding: 8px 16px 12px; background: var(--bg); flex-shrink: 0; z-index: 90; }
.search-bar { display: flex; align-items: center; gap: 8px; background: var(--bg-elev); border: none; border-radius: 12px; padding: 6px 6px 6px 12px; min-height: 44px; }
.search-bar:focus-within { background: var(--bg-elev-2); }
.search-bar > svg { width: 18px; height: 18px; color: var(--text-mute); flex-shrink: 0; stroke-width: 2.5; }
.search-bar input { flex: 1; min-width: 0; background: transparent; border: none; outline: none; color: var(--text); font-family: inherit; font-size: 17px; padding: 0 2px; }
.search-bar input::placeholder { color: var(--text-mute); }
.search-submit { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: var(--accent); border: none; border-radius: 50%; color: white; cursor: pointer; flex-shrink: 0; transition: transform 0.1s; }
.search-submit:active { transform: scale(0.9); opacity: 0.8; }
.search-submit:disabled { opacity: 0.3; }
.search-submit svg { width: 18px; height: 18px; stroke-width: 3; }
.content-wrap { flex: 1; position: relative; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 16px; min-height: 0; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; margin: 20px 0 8px; padding: 0 4px; }
.stats-row { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--bg-elev); border-radius: 14px; padding: 16px 14px; text-align: center; }
.stat-value { font-size: 24px; font-weight: 700; color: var(--text); letter-spacing: -0.5px; margin-bottom: 4px; }
.stat-label { font-size: 11px; color: var(--text-mute); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; }
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.quick-card { background: var(--bg-elev); border-radius: 14px; padding: 20px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 12px; border: none; text-align: left; font-family: inherit; color: var(--text); transition: transform 0.1s, background 0.15s; min-height: 130px; }
.quick-card:active { transform: scale(0.97); background: var(--bg-elev-2); }
.quick-card-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: rgba(0,122,255,0.12); color: var(--accent); font-size: 22px; }
.quick-card-icon.green { background: rgba(52,199,89,0.12); color: var(--green); }
.quick-card-icon.orange { background: rgba(255,149,0,0.12); color: var(--orange); }
.quick-card-icon.purple { background: rgba(175,82,222,0.12); color: var(--purple); }
.quick-card-icon.pink { background: rgba(255,45,85,0.12); color: var(--pink); }
.quick-card-icon.red { background: rgba(255,59,48,0.12); color: var(--red); }
.quick-card-icon svg { width: 24px; height: 24px; stroke-width: 2; }
.quick-card-title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 2px; }
.quick-card-sub { font-size: 12px; color: var(--text-mute); line-height: 1.3; }
.list { list-style: none; background: var(--bg); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border-soft); margin-bottom: 16px; }
.list-item { display: flex; align-items: center; gap: 14px; padding: 11px 16px; border-bottom: 0.5px solid var(--border-soft); cursor: pointer; }
.list-item:last-child { border-bottom: none; }
.list-item:active { background: var(--bg-elev); }
.list-icon { width: 29px; height: 29px; display: flex; align-items: center; justify-content: center; background: var(--accent); border-radius: 7px; color: white; flex-shrink: 0; font-size: 15px; }
.list-icon svg { width: 18px; height: 18px; stroke-width: 2; }
.list-content { flex: 1; min-width: 0; }
.list-title { font-size: 16px; color: var(--text); margin-bottom: 1px; }
.list-sub { font-size: 13px; color: var(--text-mute); }
.list-chevron { color: var(--text-mute); flex-shrink: 0; opacity: 0.5; font-size: 13px; }
.list-chevron svg { width: 16px; height: 16px; stroke-width: 2.5; }
.list-icon.red { background: var(--red); }
.list-icon.green { background: var(--green); }
.list-icon.orange { background: var(--orange); }
.list-icon.purple { background: var(--purple); }
.list-icon.pink { background: var(--pink); }
.list-icon.gray { background: var(--text-mute); }
.result-card { background: var(--bg); border-radius: 12px; overflow: hidden; border: 0.5px solid var(--border-soft); margin-bottom: 12px; }
.result-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 0.5px solid var(--border-soft); }
.result-row:last-child { border-bottom: none; }
.result-icon { width: 22px; height: 22px; flex-shrink: 0; color: var(--accent); margin-top: 1px; }
.result-icon svg { width: 22px; height: 22px; stroke-width: 2; }
.result-content { flex: 1; min-width: 0; }
.result-label { font-size: 13px; color: var(--text-mute); margin-bottom: 1px; }
.result-value { font-size: 16px; color: var(--text); word-break: break-word; }
.result-value.mono { font-family: 'SF Mono', 'Menlo', monospace; font-size: 15px; }
.result-value.accent { color: var(--accent); font-weight: 600; }
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 13px; color: var(--text-mute); margin-bottom: 6px; }
.field-input { width: 100%; padding: 12px 14px; background: var(--bg-elev); border: none; border-radius: 10px; color: var(--text); font-family: inherit; font-size: 17px; outline: none; }
.field-input:focus { background: var(--bg-elev-2); }
.field-input::placeholder { color: var(--text-mute); }
.field-hint { font-size: 12px; color: var(--text-mute); margin-top: 5px; }
.btn { width: 100%; padding: 14px 20px; background: var(--accent); border: none; border-radius: 12px; color: white; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
.btn:active { background: var(--accent-dim); transform: scale(0.98); }
.btn:disabled { opacity: 0.4; }
.btn.secondary { background: var(--bg-elev); color: var(--accent); }
.btn.danger { background: var(--red); }
.toggle { position: relative; width: 51px; height: 31px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; inset: 0; background: var(--bg-elev-2); border-radius: 15.5px; cursor: pointer; transition: 0.3s; }
.toggle-slider::before { content: ''; position: absolute; width: 27px; height: 27px; left: 2px; top: 2px; background: white; border-radius: 50%; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); transition: 0.3s; }
.toggle input:checked + .toggle-slider { background: #34c759; }
.toggle input:checked + .toggle-slider::before { transform: translateX(20px); }
.tabs { display: flex; background: var(--bg); border-top: 0.5px solid var(--border-soft); padding: 6px 0 calc(env(safe-area-inset-bottom, 0px) + 2px); flex-shrink: 0; z-index: 100; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px; background: transparent; border: none; color: var(--text-mute); cursor: pointer; font-family: inherit; border-radius: 8px; }
.tab:active { opacity: 0.5; }
.tab.active { color: var(--accent); }
.tab svg { width: 26px; height: 26px; stroke-width: 1.8; }
.tab span { font-size: 10px; font-weight: 500; }
.toast-wrap { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 90px); z-index: 1000; display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: calc(100% - 32px); max-width: 340px; }
.toast { padding: 12px 16px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-radius: 14px; font-size: 14px; font-weight: 500; color: white; text-align: center; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2); transform: translateY(20px) scale(0.95); opacity: 0; transition: transform 0.25s, opacity 0.25s; pointer-events: auto; }
.toast.show { transform: translateY(0) scale(1); opacity: 1; }
.toast.error { background: rgba(255, 59, 48, 0.95); }
.toast.ok { background: rgba(52, 199, 89, 0.95); }
.loading { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; z-index: 9999; transition: opacity 0.4s; }
.loading.hidden { opacity: 0; pointer-events: none; }
.loading-logo { width: 90px; height: 90px; }
.loading-text { font-family: 'SF Mono', 'Menlo', monospace; font-size: 11px; letter-spacing: 3px; color: var(--text-mute); text-transform: uppercase; }
.loading-bar { width: 100px; height: 3px; background: var(--bg-elev-2); border-radius: 2px; overflow: hidden; }
.loading-bar::after { content: ''; display: block; width: 40%; height: 100%; background: var(--accent); animation: loading 1.2s ease-in-out infinite; }
@keyframes loading { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
.logo-rotator { transform-origin: 50px 50px; animation: logoSpin 3s linear infinite; }
@keyframes logoSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.logo-pulse { transform-origin: 58px 58px; animation: logoPulse 1.8s ease-in-out infinite; }
@keyframes logoPulse { 0%, 100% { opacity: 1; transform: scale(1); stroke-width: 2.5; } 50% { opacity: 0.4; transform: scale(1.25); stroke-width: 1.5; } }
.logo-triangle { stroke-dasharray: 260; stroke-dashoffset: 260; animation: logoDraw 3s ease-in-out infinite; }
@keyframes logoDraw { 0% { stroke-dashoffset: 260; opacity: 0.4; } 50% { stroke-dashoffset: 0; opacity: 1; } 100% { stroke-dashoffset: -260; opacity: 0.4; } }
.chart-wrap { background: var(--bg-elev); border-radius: 14px; padding: 16px; margin-bottom: 16px; }
.chart-canvas-wrap { height: 180px; position: relative; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; z-index: 2000; padding: 20px; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal { background: var(--bg); border-radius: 20px; width: 100%; max-width: 400px; max-height: 85vh; overflow-y: auto; padding: 24px; animation: modalIn 0.25s ease; }
@keyframes modalIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
.modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
.modal-desc { font-size: 14px; color: var(--text-mute); margin-bottom: 20px; line-height: 1.5; }
.hist-item { background: var(--bg-elev); border-radius: 12px; padding: 12px 14px; margin-bottom: 8px; border-left: 3px solid var(--accent); }
.hist-item .hist-top { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-mute); margin-bottom: 6px; gap: 8px; }
.hist-item .hist-target { font-size: 14px; color: var(--text); font-family: 'SF Mono', monospace; word-break: break-all; }
.hist-item .hist-summary { font-size: 13px; color: var(--text-dim); margin-top: 4px; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
@keyframes pulsePin { 0% { transform: scale(0.7); opacity: 0.6; } 100% { transform: scale(1.6); opacity: 0; } }
#phone-map .leaflet-control-zoom a { background: var(--bg) !important; color: var(--accent) !important; border: none !important; width: 36px !important; height: 36px !important; line-height: 34px !important; font-size: 18px !important; }
#phone-map .leaflet-control-zoom-in { border-radius: 10px 10px 0 0 !important; }
#phone-map .leaflet-control-zoom-out { border-radius: 0 0 10px 10px !important; }
#phone-map .leaflet-popup-content-wrapper { background: var(--bg) !important; color: var(--text) !important; border-radius: 12px !important; box-shadow: 0 8px 24px rgba(0,0,0,0.15) !important; }
#phone-map .leaflet-popup-tip { background: var(--bg) !important; }
#phone-map .leaflet-control-attribution { display: none !important; }
.vk-card { background: var(--bg-elev); border-radius: 16px; padding: 14px; display: flex; gap: 14px; align-items: center; border: 1px solid var(--border-soft); margin-bottom: 10px; }
.vk-avatar { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); flex-shrink: 0; background: linear-gradient(135deg, var(--accent), var(--purple)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 26px; }
.vk-info { flex: 1; min-width: 0; }
.vk-name { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 4px; }
.vk-meta { font-size: 12px; color: var(--text-mute); margin-bottom: 4px; }
.vk-link { display: inline-block; font-size: 12px; color: var(--accent); text-decoration: none; background: rgba(0,122,255,0.1); padding: 5px 12px; border-radius: 8px; font-weight: 600; }

#auth-screen { position: fixed; inset: 0; z-index: 5000; background: var(--bg); overflow-y: auto; display: none; animation: fadeIn 0.3s ease; }
.auth-wrap { max-width: 420px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 40px) 24px 40px; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; }
.auth-logo { width: 88px; height: 88px; border-radius: 50%; background: linear-gradient(135deg, #60a5fa, #007aff); display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; box-shadow: 0 8px 32px rgba(0,122,255,0.35); animation: logoGlow 2.4s ease-in-out infinite; }
.auth-logo svg { width: 48px; height: 48px; }
.auth-title { font-size: 26px; font-weight: 700; text-align: center; margin-bottom: 8px; color: var(--text); letter-spacing: -0.5px; }
.auth-sub { font-size: 14px; color: var(--text-mute); text-align: center; margin-bottom: 32px; line-height: 1.5; }
.auth-card { background: var(--bg-elev); border-radius: 18px; padding: 20px; }
.auth-card .field { margin-bottom: 12px; }
.auth-card .field:last-child { margin-bottom: 0; }
.auth-code-input { text-align: center !important; font-size: 32px !important; letter-spacing: 14px !important; font-family: 'SF Mono', 'Menlo', monospace !important; font-weight: 700 !important; padding-left: 24px !important; color: var(--accent) !important; }
.auth-status { margin-top: 16px; font-size: 13px; text-align: center; min-height: 20px; line-height: 1.4; }
.auth-status.ok { color: var(--green); }
.auth-status.err { color: var(--red); }
.auth-hint { text-align: center; font-size: 12px; color: var(--text-mute); margin-top: 20px; line-height: 1.5; }
.auth-hint a { color: var(--accent); text-decoration: none; font-weight: 600; }

/* 🎨 СКАНЕР ЛИЦА */
.scaner-wrap { background: linear-gradient(135deg, #0a1628, #0f2540); border-radius: 20px; padding: 20px; box-shadow: 0 10px 40px rgba(0, 200, 255, 0.15), inset 0 0 60px rgba(0, 150, 255, 0.05); border: 1px solid rgba(0, 200, 255, 0.2); }
.scaner-frame { position: relative; width: 100%; max-width: 260px; aspect-ratio: 3/4; margin: 0 auto 20px; border-radius: 16px; overflow: hidden; background: #000; box-shadow: 0 0 40px rgba(0, 200, 255, 0.3); }
.scaner-image { width: 100%; height: 100%; object-fit: cover; filter: brightness(0.85) contrast(1.1) hue-rotate(180deg) saturate(1.2); transition: filter 0.3s; }
.scaner-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(0, 210, 255, 0.15) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 210, 255, 0.15) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; animation: gridPulse 2s ease-in-out infinite; z-index: 2; }
@keyframes gridPulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.7; } }
.scaner-line { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #00d4ff, #00e5ff, #00d4ff, transparent); box-shadow: 0 0 20px #00d4ff, 0 0 40px #00d4ff, 0 0 60px #00d4ff; animation: scanLine 2.5s ease-in-out infinite; z-index: 3; }
@keyframes scanLine { 0% { top: -3px; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
.scaner-pulse { position: absolute; top: 50%; left: 50%; width: 100px; height: 100px; margin: -50px 0 0 -50px; border: 2px solid rgba(0, 212, 255, 0.6); border-radius: 50%; animation: pulseRing 2s ease-out infinite; z-index: 2; pointer-events: none; }
.scaner-pulse::before { content: ''; position: absolute; inset: -20px; border: 2px solid rgba(0, 212, 255, 0.4); border-radius: 50%; animation: pulseRing 2s ease-out infinite 0.5s; }
.scaner-pulse::after { content: ''; position: absolute; inset: -40px; border: 2px solid rgba(0, 212, 255, 0.2); border-radius: 50%; animation: pulseRing 2s ease-out infinite 1s; }
@keyframes pulseRing { 0% { transform: scale(0.5); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
.scaner-corners { position: absolute; inset: 8px; pointer-events: none; z-index: 4; }
.scaner-corners::before, .scaner-corners::after { content: ''; position: absolute; width: 30px; height: 30px; border: 3px solid #00e5ff; filter: drop-shadow(0 0 8px #00e5ff); }
.scaner-corners::before { top: 0; left: 0; border-right: none; border-bottom: none; border-radius: 8px 0 0 0; }
.scaner-corners::after { bottom: 0; right: 0; border-left: none; border-top: none; border-radius: 0 0 8px 0; }
.scaner-frame::before, .scaner-frame::after { content: ''; position: absolute; width: 30px; height: 30px; border: 3px solid #00e5ff; filter: drop-shadow(0 0 8px #00e5ff); pointer-events: none; z-index: 4; }
.scaner-frame::before { top: 8px; right: 8px; border-left: none; border-bottom: none; border-radius: 0 8px 0 0; }
.scaner-frame::after { bottom: 8px; left: 8px; border-right: none; border-top: none; border-radius: 0 0 0 8px; }
.scaner-points { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
.scaner-point { position: absolute; width: 8px; height: 8px; background: #00e5ff; border-radius: 50%; box-shadow: 0 0 12px #00e5ff, 0 0 20px #00d4ff; animation: pointPulse 1.5s ease-in-out infinite; }
.scaner-point::after { content: ''; position: absolute; inset: -6px; border: 1px solid #00e5ff; border-radius: 50%; opacity: 0.5; animation: pointRing 1.5s ease-out infinite; }
@keyframes pointPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.3); opacity: 0.7; } }
@keyframes pointRing { 0% { transform: scale(0.5); opacity: 0.8; } 100% { transform: scale(2); opacity: 0; } }
.scaner-status { text-align: center; }

<script>
// ============================================================

const CONFIG = {

};

const savedVer = localStorage.getItem('aa_key_version');
if (savedVer !== CONFIG.API_KEY_VERSION) {
  localStorage.removeItem('aa_token');
  localStorage.setItem('aa_key_version', CONFIG.API_KEY_VERSION);
}

try {
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.disableVerticalSwipes?.(); }
} catch (e) {}

let currentTheme = localStorage.getItem('aa_theme') || 'dark';
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  currentTheme = theme;
  localStorage.setItem('aa_theme', theme);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute('content', theme === 'dark' ? '#000000' : '#ffffff');
  try {
    const tg = window.Telegram?.WebApp;
    tg?.setHeaderColor?.(theme === 'dark' ? '#000000' : '#ffffff');
    tg?.setBackgroundColor?.(theme === 'dark' ? '#000000' : '#ffffff');
  } catch (e) {}
}
document.documentElement.setAttribute('data-theme', currentTheme);

const $ = id => document.getElementById(id);
const searchInput = $('search-input');
const searchBtn = $('search-btn');
const toasts = $('toasts');
const contentWrap = $('content-wrap');

let APIFY_TOKEN = localStorage.getItem('aa_token') || CONFIG.API_KEY;
let currentTab = 'home';
let currentScreen = { name: 'home', data: null };
let _meCache = { userId: null, data: null, ts: 0 };

// ============================================================
// HELPERS
// ============================================================
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function formatDate(iso) { if (!iso) return '—'; try { const d = new Date(iso); return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + '.' + d.getFullYear(); } catch(e) { return String(iso).slice(0, 10); } }
function formatTime(iso) { if (!iso) return ''; try { const d = new Date(iso); return String(d.getDate()).padStart(2,'0') + '.' + String(d.getMonth()+1).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); } catch(e) { return String(iso).slice(0, 16); } }
function toast(msg, type = '') { const el = document.createElement('div'); el.className = 'toast ' + type; el.textContent = msg; toasts.appendChild(el); requestAnimationFrame(() => el.classList.add('show')); setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); }, 3000); }
function vibrate(ms = 10) { if (navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }
function formatNumber(n) { if (n == null) return '0'; return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function setText(id, value) { const el = document.getElementById(id); if (el) el.textContent = value; }
function setHTML(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }
function getTelegramUser() { try { const u = window.Telegram?.WebApp?.initDataUnsafe?.user; if (u) { localStorage.setItem('aa_tg_user', JSON.stringify(u)); return u; } const s = localStorage.getItem('aa_tg_user'); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function isAdmin() { const u = getTelegramUser(); return u && u.id === CONFIG.ADMIN_ID; }
function copyToClipboard(text) {
  if (!text) { toast('❌ Нечего копировать', 'error'); return; }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(() => { toast('✅ Скопировано', 'ok'); vibrate(30); }).catch(() => fallbackCopy(text));
    } else { fallbackCopy(text); }
  } catch (e) { fallbackCopy(text); }
}
function fallbackCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, ta.value.length);
    document.execCommand('copy');
    ta.remove();
    toast('✅ Скопировано', 'ok');
    vibrate(30);
  } catch (e) { toast('❌ Не удалось скопировать', 'error'); }
}
function chatLinkFromId(chatId) { if (!chatId) return null; const s = String(chatId); if (s.startsWith('-100')) return 'https://t.me/c/' + s.slice(4); if (s.startsWith('-')) return 'https://t.me/c/' + s.slice(1); return null; }

// ============================================================
// 📡 ЗАПРОСЫ С АВТОПОВТОРОМ
// ============================================================
async function pubGet(path, retries = 3) {
  let lastError;
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(CONFIG.API_BASE + path, { headers: { 'ngrok-skip-browser-warning': 'true' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const text = await r.text();
      try { return JSON.parse(text); } catch (e) { throw new Error('Не JSON'); }
    } catch (e) {
      lastError = e;
      if (i < retries - 1) { await new Promise(r => setTimeout(r, 2000)); }
    }
  }
  throw lastError;
}
async function pubPost(path, body, retries = 3) {
  let lastError;
  for (let i = 0; i < retries; i++) {
    try {
      const r = await fetch(CONFIG.API_BASE + path, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' }, body: JSON.stringify(body) });
      const text = await r.text();
      try { return JSON.parse(text); } catch (e) { return { success: false, error: 'Не JSON' }; }
    } catch (e) {
      lastError = e;
      if (i < retries - 1) { await new Promise(r => setTimeout(r, 2000)); }
    }
  }
  throw lastError;
}

// ============================================================
// 🔥 ПРОГРЕВ API
// ============================================================
async function waitForAPI(maxWaitMs = 15000) {
  const start = Date.now();
  let attempt = 0;
  while (Date.now() - start < maxWaitMs) {
    attempt++;
    try {
      const r = await fetch(CONFIG.API_BASE + '/api/public/stats', { headers: { 'ngrok-skip-browser-warning': 'true' } });
      if (r.ok) { console.log(`✅ API готов (попытка ${attempt})`); return true; }
    } catch (e) {}
    const txt = $('loading-text');
    if (txt) txt.textContent = `ПОДКЛЮЧЕНИЕ... (${attempt})`;
    await new Promise(r => setTimeout(r, 1000));
  }
  return false;
}

async function getMe(force = false) {
  const u = getTelegramUser();
  if (!u) return { diamonds: 0, has_subscription: false, days_left: 0, subscription_end: null };
  const now = Date.now();
  if (!force && _meCache.userId === u.id && (now - _meCache.ts) < 5000 && _meCache.data) return _meCache.data;
  try { const data = await pubGet('/api/me/' + u.id); _meCache = { userId: u.id, data, ts: now }; return data; } catch(e) { return { diamonds: 0, has_subscription: false, days_left: 0, subscription_end: null }; }
}

// ============================================================
// AUTH
// ============================================================
function showAuthScreen() { const a = document.getElementById('auth-screen'); const b = document.getElementById('app'); if (a) a.style.display = 'block'; if (b) b.style.display = 'none'; }
function hideAuthScreen() { const a = document.getElementById('auth-screen'); const b = document.getElementById('app'); if (a) a.style.display = 'none'; if (b) b.style.display = 'flex'; }
function setAuthStatus(text, type = '') { const el = document.getElementById('auth-status'); if (!el) return; el.textContent = text; el.className = 'auth-status' + (type ? ' ' + type : ''); }

async function requestAuthCode() {
  const input = document.getElementById('auth-identifier');
  const btn = document.getElementById('auth-get-code-btn');
  const raw = (input.value || '').trim();
  if (!raw) { setAuthStatus('❌ Введите ID или @username', 'err'); return; }
  const isId = /^\d{5,15}$/.test(raw);
  const isUsername = /^@?[a-zA-Z][a-zA-Z0-9_]{2,31}$/.test(raw);
  if (!isId && !isUsername) { setAuthStatus('❌ Введите корректный ID или @username', 'err'); return; }
  btn.disabled = true; btn.textContent = '⏳ Отправка...'; setAuthStatus('');
  try {
    const r = await fetch(CONFIG.API_BASE + '/api/auth/request_code', { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' }, body: JSON.stringify({ identifier: raw }) });
    const text = await r.text();
    let data = {}; try { data = JSON.parse(text); } catch(e) { data = { success: false, error: 'Не JSON' }; }
    if (data.success) {
      document.getElementById('auth-step-1').style.display = 'none';
      document.getElementById('auth-step-2').style.display = 'block';
      document.getElementById('auth-code').focus();
      setAuthStatus('✅ Код отправлен! Проверьте Telegram', 'ok');
    } else setAuthStatus('❌ ' + (data.error || 'Ошибка'), 'err');
  } catch (e) { setAuthStatus('❌ Ошибка сети: ' + e.message, 'err'); }
  finally { btn.disabled = false; btn.textContent = '📩 Получить код'; }
}
async function verifyAuthCode() {
  const codeInput = document.getElementById('auth-code');
  const btn = document.getElementById('auth-verify-btn');
  const code = (codeInput.value || '').trim();
  if (!/^\d{6}$/.test(code)) { setAuthStatus('❌ Код должен быть 6 цифр', 'err'); return; }
  btn.disabled = true; btn.textContent = '⏳ Проверка...'; setAuthStatus('');
  try {
    const r = await fetch(CONFIG.API_BASE + '/api/auth/verify_code', { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true' }, body: JSON.stringify({ code }) });
    const text = await r.text();
    let data = {}; try { data = JSON.parse(text); } catch(e) { data = { success: false, error: 'Не JSON' }; }
    if (data.success && data.user) {
      localStorage.setItem('aa_tg_user', JSON.stringify(data.user));
      _meCache = { userId: null, data: null, ts: 0 };
      hideAuthScreen(); getDailyUsage(); updateRequestsBadge(); updateNotifBadge(); renderScreen('home');

      toast('✅ Добро пожаловать!', 'ok');

  finally { btn.disabled = false; btn.textContent = '✅ Войти'; }
}
function logout() {

function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function getDailyUsage() { try { const data = localStorage.getItem('aa_daily_usage'); if (!data) return { used: 0, date: todayStr() }; const parsed = JSON.parse(data); if (parsed.date !== todayStr()) return { used: 0, date: todayStr() }; return parsed; } catch (e) { return { used: 0, date: todayStr() }; } }
function saveDailyUsage(usage) { try { localStorage.setItem('aa_daily_usage', JSON.stringify(usage)); } catch (e) {} }
function getRequestsLeft() { if (isAdmin()) return Infinity; const u = getDailyUsage(); return Math.max(0, CONFIG.DAILY_LIMIT - u.used); }
function useRequest() { if (isAdmin()) return true; const u = getDailyUsage(); if (u.used >= CONFIG.DAILY_LIMIT) return false; u.used++; u.date = todayStr(); saveDailyUsage(u); return true; }
async function checkAndUseRequest() {
  if (isAdmin()) return { ok: true, message: '' };
  const me = await getMe();
  if (me && me.has_subscription) return { ok: true, message: '' };
  const left = getRequestsLeft();
  if (left <= 0) return { ok: false, message: '❌ Лимит запросов исчерпан!' };
  useRequest();
  return { ok: true, message: '' };
}
async function updateRequestsBadge() {
  const badge = document.getElementById('requests-badge');
  if (!badge) return;
  if (isAdmin()) { badge.textContent = '👑 Безлимит'; badge.style.background = 'rgba(255,149,0,0.15)'; badge.style.color = 'var(--orange)'; return; }
  const me = await getMe();
  if (me && me.has_subscription) { badge.textContent = '⭐ Безлимит'; badge.style.background = 'rgba(52,199,89,0.15)'; badge.style.color = 'var(--green)'; return; }
  const left = getRequestsLeft();
  badge.textContent = '📊 ' + left + '/' + CONFIG.DAILY_LIMIT;
  if (left === 0) { badge.style.background = 'rgba(255,59,48,0.15)'; badge.style.color = 'var(--red)'; }
  else if (left <= 2) { badge.style.background = 'rgba(255,149,0,0.15)'; badge.style.color = 'var(--orange)'; }
  else { badge.style.background = 'rgba(52,199,89,0.15)'; badge.style.color = 'var(--green)'; }
}

async function updateNotifBadge() {
  const u = getTelegramUser();

}

async function apiRequest(path, opts = {}) {
  const headers = { 'Authorization': 'Bearer ' + APIFY_TOKEN, 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': 'true', ...(opts.headers || {}) };
  const r = await fetch(CONFIG.API_BASE + path, { ...opts, headers });
  if (r.status === 401) throw new Error('Неверный API-токен');
  if (r.status === 403) { let d = ''; try { d = (await r.json()).error || ''; } catch (e) {} throw new Error(d || 'Доступ запрещён'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

async function loadProfileAvatar(userId) {
  const img = document.getElementById('profile-avatar-img');
  const initials = document.getElementById('profile-avatar-initials');
  if (!img) {
    console.warn('[PROFILE-AVATAR] img not found');
    return;
  }

  try {
    const url = CONFIG.API_BASE + '/api/user_avatar/' + userId + '?t=' + Date.now();
    const r = await fetch(url, {
      headers: { 'ngrok-skip-browser-warning': 'true' }
    });
    if (!r.ok) return;
    const blob = await r.blob();
    if (!blob.type.startsWith('image/')) return;
    if (blob.size < 100) return;
    img.src = URL.createObjectURL(blob);
    img.style.opacity = '1';
    if (initials) initials.style.display = 'none';
    console.log('[PROFILE-AVATAR] ✅ Loaded:', blob.size, 'bytes');
  } catch (e) {
    console.warn('[PROFILE-AVATAR] ❌ Failed:', e);
  }
}

        let w = img.width, h = img.height;
        if (w > h && w > MAX) { h = Math.round(h * MAX / w); w = MAX; }

      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  $('ps-btn').addEventListener('click', async () => {

      const data = await pubPost('/api/google_lens_search', { image: imageData });
      setTimeout(() => { $('ps-scanner-container').style.display = 'none'; }, 800);
      
      if (!data.success) {
        $('ps-results').innerHTML = renderError(data.error || 'Ошибка');
        return;
      }
      const results = data.results || [];
      if (!results.length) {
        $('ps-results').innerHTML = renderEmpty('Лицо не найдено');
        return;
      }
      $('ps-results').innerHTML = `<div class="section-title" style="color:var(--green);">🎯 Найдено: ${results.length}</div>` + results.map((r, idx) => {

            <div class="face-info">

    } catch(e) {
      $('ps-results').innerHTML = renderError('Ошибка: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '🔍 Найти лицо';
    }
  });
}

function copyAllComments() {

    const uname = msg.username ? `@${msg.username}` : '';
    text += `═══ СООБЩЕНИЕ #${idx + 1} ═══\n👤 ${name} ${uname}\n🆔 ID: ${msg.user_id}\n📌 Чат: ${msg.chat_title || '—'}\n📅 Дата: ${(msg.message_date || '').slice(0, 16)}\n💬 ${msg.message_text || ''}\n\n`;

async function loadProfileAvatar(userId) {
  const img = document.getElementById('profile-avatar-img');
  const initials = document.getElementById('profile-avatar-initials');
  if (!img) {
    console.warn('[PROFILE-AVATAR] img not found');
    return;
  }

  try {
    const url = CONFIG.API_BASE + '/api/user_avatar/' + userId + '?t=' + Date.now();
    console.log('[PROFILE-AVATAR] Loading:', url);

    const r = await fetch(url, {
      headers: { 'ngrok-skip-browser-warning': 'true' }
    });

    console.log('[PROFILE-AVATAR] HTTP status:', r.status, '| type:', r.headers.get('content-type'));

    if (!r.ok) {
      console.warn('[PROFILE-AVATAR] HTTP error:', r.status);
      return;
    }

    const blob = await r.blob();

    if (!blob.type.startsWith('image/')) {
      console.warn('[PROFILE-AVATAR] Not an image:', blob.type);
      return;
    }

    if (blob.size < 100) {
      console.warn('[PROFILE-AVATAR] Too small:', blob.size);
      return;
    }

    img.src = URL.createObjectURL(blob);
    img.style.opacity = '1';
    if (initials) initials.style.display = 'none';
    console.log('[PROFILE-AVATAR] ✅ Loaded:', blob.size, 'bytes');
  } catch (e) {
    console.warn('[PROFILE-AVATAR] ❌ Failed:', e);
  }
}

          if (currentUser) {
            pubPost('/api/save_local_search', {

function fieldIcon(field) { const f = String(field).toLowerCase(); if (f.includes('фио')||f.includes('имя')||f.includes('name')||f.includes('фамил')) return '👤'; if (f.includes('рожд')||f.includes('birth')||f.includes('дата')||f.includes('др')) return '📅'; if (f.includes('телефон')||f.includes('phone')||f.includes('тел')) return '📞'; if (f.includes('почт')||f.includes('email')||f.includes('mail')) return '📧'; if (f.includes('паспорт')||f.includes('passport')) return '🪪'; if (f.includes('адрес')||f.includes('address')||f.includes('город')) return '🏠'; if (f.includes('авто')||f.includes('car')) return '🚗'; if (f.includes('банк')||f.includes('bank')||f.includes('карт')) return '🏦'; if (f.includes('инн')) return '📋'; if (f.includes('снилс')) return '🔢'; if (f.includes('vk')||f.includes('вк')) return '🔵'; if (f.includes('tg')||f.includes('telegram')) return '✈️'; if (f.includes('актуальность')||f.includes('дата обновления')) return '📅'; return '📌'; }
function renderExtendedResults(items, query, targetId) {
  let html = `<div class="section-title" style="color:var(--green);">✅ Найдено записей: ${items.length}</div>`;
  const databases = new Set(); items.forEach(it => { if (it.database) databases.add(it.database); });
  if (databases.size) html += `<div style="background:var(--bg-elev);border-radius:12px;padding:12px 16px;margin-bottom:12px;font-size:13px;color:var(--text-mute);">📊 Найдено в <b style="color:var(--accent);">${databases.size}</b> базах</div>`;
  if (items.length > 1) html += `<button class="btn secondary" onclick="copyAllResults('${targetId}')" style="margin-bottom:12px;">📄 Копировать все записи (${items.length})</button>`;
  const fieldOrder = ['ФИО', 'ИМЯ', 'ДАТА РОЖДЕНИЯ', 'ДР', 'ТЕЛЕФОН', 'ПОЧТА', 'EMAIL', 'ПАСПОРТ', 'АДРЕС', 'ИНН', 'СНИЛС', 'VK', 'FB', 'TG', 'OK', 'INSTAGRAM', 'БАНК', 'КАРТА'];
  function sortKeys(obj) { return Object.keys(obj).sort((a, b) => { const ia = fieldOrder.findIndex(x => String(a).toUpperCase().includes(x)); const ib = fieldOrder.findIndex(x => String(b).toUpperCase().includes(x)); if (ia === -1 && ib === -1) return String(a).localeCompare(String(b)); if (ia === -1) return 1; if (ib === -1) return -1; return ia - ib; }); }
  if (!window._extendedResults) window._extendedResults = {};
  window._extendedResults[targetId] = [];
  items.forEach((item, idx) => {
    const cleanItem = {}; Object.entries(item).forEach(([k, v]) => { if (v === null || v === undefined || v === '') return; if (k === 'database') return; cleanItem[k] = v; });
    if (Object.keys(cleanItem).length === 0) return;
    window._extendedResults[targetId][idx] = cleanItem;
    let mainName = cleanItem['ФИО'] || cleanItem['ИМЯ'] || '';
    if (!mainName) { for (const [k, v] of Object.entries(cleanItem)) { const kl = String(k).toLowerCase(); if (kl.includes('фио') || kl.includes('имя')) { mainName = v; break; } } }
    if (!mainName) mainName = `Запись #${idx + 1}`;
    const dbSource = item.database || '—';
    html += `<div class="result-card" style="margin-bottom:14px;"><div style="padding:12px 16px;background:linear-gradient(135deg, rgba(52,199,89,0.15), rgba(0,122,255,0.1));border-bottom:0.5px solid var(--border-soft);display:flex;align-items:center;gap:10px;"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#34c759,#30b14e);color:white;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex-shrink:0;">${idx + 1}</div><div style="flex:1;min-width:0;"><div style="font-size:15px;font-weight:700;color:var(--text);">👤 ${esc(mainName)}</div><div style="font-size:11px;color:var(--text-mute);margin-top:2px;">🗄 ${esc(String(dbSource).slice(0, 60))}</div></div><button onclick="copyResultItem('${targetId}', ${idx})" style="background:var(--accent);border:none;border-radius:10px;color:white;padding:8px 12px;font-size:12px;font-weight:600;cursor:pointer;">📋</button></div><div style="padding:0;">`;
    sortKeys(cleanItem).forEach(field => {
      const value = cleanItem[field];
      let display = esc(String(value));
      if (/^https?:\/\//.test(String(value))) display = `<a href="${esc(value)}" target="_blank" style="color:var(--accent);text-decoration:none;word-break:break-all;">${esc(value)}</a>`;
      else if (/^[\w.+-]+@[\w.-]+\.\w+$/.test(String(value))) display = `<a href="mailto:${esc(value)}" style="color:var(--accent);text-decoration:none;">${esc(value)}</a>`;
      else if (/^\+?\d{10,15}$/.test(String(value).replace(/\D/g, '')) && String(value).replace(/\D/g, '').length >= 10) { const digits = String(value).replace(/\D/g, ''); display = `<a href="tel:+${esc(digits)}" style="color:var(--accent);text-decoration:none;">${esc(value)}</a>`; }
      html += `<div style="display:flex;padding:10px 16px;border-bottom:0.5px solid var(--border-soft);gap:12px;"><div style="font-size:16px;flex-shrink:0;width:22px;text-align:center;">${fieldIcon(field)}</div><div style="flex:1;min-width:0;"><div style="font-size:11px;color:var(--text-mute);text-transform:uppercase;font-weight:600;margin-bottom:3px;">${esc(field)}</div><div style="font-size:14px;color:var(--text);word-break:break-word;">${display}</div></div></div>`;
    });
    html += `</div></div>`;
  });
  const el = document.getElementById(targetId); if (el) { el.innerHTML = html; vibrate(50); toast('✅ Найдено: ' + items.length, 'ok'); }
}
function copyResultItem(targetId, idx) { const data = window._extendedResults?.[targetId]?.[idx]; if (!data) { toast('❌ Нет данных', 'error'); return; } let text = ''; Object.entries(data).forEach(([k, v]) => { text += `${k}: ${v}\n`; }); copyToClipboard(text.trim()); }

async function loadMeAvatar(userId) {
  const img = document.getElementById('me-avatar-img');
  const fallback = document.getElementById('me-avatar-fallback');
  if (!img) {
    console.warn('[AVATAR] img not found');
    return;
  }

  try {
    const url = CONFIG.API_BASE + '/api/user_avatar/' + userId + '?t=' + Date.now();

    const r = await fetch(url, {
      headers: { 'ngrok-skip-browser-warning': 'true' }
    });

    if (!r.ok) return;

    const blob = await r.blob();
    if (!blob.type.startsWith('image/')) return;
    if (blob.size < 100) return;

    img.src = URL.createObjectURL(blob);
    img.style.opacity = '1';
    if (fallback) fallback.style.opacity = '0';
    console.log('[AVATAR] ✅ Loaded:', blob.size, 'bytes');
  } catch (e) {
    console.warn('[AVATAR] ❌ Failed:', e);
  }
}

let _aiChatHistory = [];
let _aiVoiceRecognition = null;

function renderAiAssistant() {
  const u = getTelegramUser();
  if (!u) { toast('Откройте через Telegram', 'error'); return; }

  // Восстанавливаем историю из localStorage

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <div class="section-title" style="margin:0;">🤖 AI Помощник «Марыям»</div>

    </div>

    <div style="position:fixed;bottom:calc(env(safe-area-inset-bottom, 0px) + 60px);left:0;right:0;padding:10px 16px;background:linear-gradient(180deg,transparent,var(--bg) 30%);z-index:50;">
      <div style="display:flex;gap:8px;align-items:flex-end;max-width:600px;margin:0 auto;">
        <button onclick="toggleAiVoice()" id="ai-voice-btn" style="width:44px;height:44px;border-radius:50%;background:var(--bg-elev);border:none;color:var(--accent);font-size:18px;flex-shrink:0;cursor:pointer;" title="Голосовой ввод">🎤</button>
        <textarea id="ai-input" placeholder="Спросите что-нибудь..." style="flex:1;min-height:44px;max-height:120px;padding:12px 14px;background:var(--bg-elev);border:none;border-radius:14px;color:var(--text);font-family:inherit;font-size:15px;outline:none;resize:none;" rows="1"></textarea>
        <button onclick="sendAiMessage()" id="ai-send-btn" style="width:44px;height:44px;border-radius:50%;background:var(--accent);border:none;color:white;font-size:18px;flex-shrink:0;cursor:pointer;" title="Отправить">➤</button>
      </div>
      <div style="text-align:center;font-size:11px;color:var(--text-mute);margin-top:6px;">AI может ошибаться. Проверяйте важное.</div>
    </div>
  `;

  // Автопрокрутка вниз
  const container = document.getElementById('ai-chat-container');
  setTimeout(() => {
    container?.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }, 100);

  // Enter для отправки (Shift+Enter — новая строка)
  const input = document.getElementById('ai-input');
  input?.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendAiMessage();
    }
  });

  // Автовысота textarea
  input?.addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });

  // Примеры вопросов, если пусто
  if (_aiChatHistory.length === 0) {

      'Что такое API токен?',
      'Как купить подписку?',
      'Расскажи о боте',
    ];

      const container = document.getElementById('ai-chat-container');
      if (container && _aiChatHistory.length === 0) {
        container.innerHTML = `
          <div style="padding:20px;text-align:center;color:var(--text-mute);">

            <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:4px;">Привет! Я Марыям</div>

              ${examples.map(ex => `
                <button onclick="askAiExample('${esc(ex)}')" style="background:var(--bg-elev);border:1px solid var(--border-soft);border-radius:14px;padding:10px 14px;color:var(--text);font-size:13px;cursor:pointer;text-align:left;">${esc(ex)}</button>
              `).join('')}
            </div>
          </div>
        `;
      }
    }, 50);
  }
}

function renderAiMessages() {
  if (!_aiChatHistory.length) return '';
  return _aiChatHistory.map(msg => {
    const isUser = msg.role === 'user';
    return `
      <div style="display:flex;justify-content:${isUser ? 'flex-end' : 'flex-start'};">
        <div style="max-width:85%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.4;word-break:break-word;${isUser ? 'background:var(--accent);color:white;border-bottom-right-radius:4px;' : 'background:var(--bg-elev);color:var(--text);border-bottom-left-radius:4px;'}">
          ${isUser ? esc(msg.content) : formatAiAnswer(msg.content)}
        </div>
      </div>
    `;
  }).join('');
}

function formatAiAnswer(text) {
  if (!text) return '';
  // Экранируем HTML
  let html = esc(text);
  // Переносы строк → <br>
  html = html.replace(/\n/g, '<br>');
  // **жирный** → <b>
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // *курсив* → <i>
  html = html.replace(/\*(.+?)\*/g, '<i>$1</i>');
  // `код` → <code>
  html = html.replace(/`(.+?)`/g, '<code style="background:rgba(0,0,0,0.15);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:12px;">$1</code>');
  return html;
}

function askAiExample(text) {
  const input = document.getElementById('ai-input');
  if (input) {
    input.value = text;
    sendAiMessage();
  }
}

async function sendAiMessage() {
  const u = getTelegramUser();
  if (!u) return;

  const input = document.getElementById('ai-input');
  const sendBtn = document.getElementById('ai-send-btn');
  const question = input?.value.trim();

  if (!question) return;

  // Добавляем сообщение пользователя
  _aiChatHistory.push({ role: 'user', content: question });
  input.value = '';
  input.style.height = 'auto';
  saveAiChat();
  updateAiChatView();

  // Заблокировать кнопку
  if (sendBtn) sendBtn.disabled = true;

  // Показываем «печатает...»
  const container = document.getElementById('ai-chat-container');
  if (container) {
    const typing = document.createElement('div');
    typing.id = 'ai-typing';
    typing.style.cssText = 'display:flex;justify-content:flex-start;';
    typing.innerHTML = `
      <div style="max-width:85%;padding:12px 18px;border-radius:16px;background:var(--bg-elev);color:var(--text-mute);border-bottom-left-radius:4px;">
        <span style="animation:blink 1.4s infinite;">●</span>
        <span style="animation:blink 1.4s infinite 0.2s;">●</span>
        <span style="animation:blink 1.4s infinite 0.4s;">●</span>
      </div>
    `;
    container.appendChild(typing);
    container.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  try {
    // История без последнего сообщения
    const history = _aiChatHistory.slice(0, -1);

    const data = await pubPost('/api/ai/chat', {
      user_id: u.id,
      question: question,
      history: history
    });

    // Убираем «печатает»
    document.getElementById('ai-typing')?.remove();

    if (data.success && data.answer) {
      _aiChatHistory.push({ role: 'assistant', content: data.answer });
      saveAiChat();
      updateAiChatView();
      vibrate(30);
    } else {
      _aiChatHistory.push({ role: 'assistant', content: '❌ ' + (data.error || 'Не удалось получить ответ') });
      updateAiChatView();
    }
  } catch (e) {
    document.getElementById('ai-typing')?.remove();
    _aiChatHistory.push({ role: 'assistant', content: '❌ Ошибка сети: ' + e.message });
    updateAiChatView();
  } finally {
    if (sendBtn) sendBtn.disabled = false;
  }
}

function updateAiChatView() {
  const container = document.getElementById('ai-chat-container');
  if (!container) return;
  container.innerHTML = renderAiMessages();
  container.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

function saveAiChat() {
  try {
    localStorage.setItem('aa_ai_chat', JSON.stringify(_aiChatHistory.slice(-20)));
  } catch(e) {}
}

function clearAiChat() {
  if (!confirm('Очистить всю переписку с AI?')) return;
  _aiChatHistory = [];
  localStorage.removeItem('aa_ai_chat');
  renderAiAssistant();
  toast('✅ Очищено', 'ok');
}

function toggleAiVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    toast('❌ Голосовой ввод не поддерживается', 'error');
    return;
  }

  const btn = document.getElementById('ai-voice-btn');

  if (_aiVoiceRecognition) {
    // Останавливаем
    _aiVoiceRecognition.stop();
    _aiVoiceRecognition = null;
    if (btn) {
      btn.style.background = 'var(--bg-elev)';
      btn.style.color = 'var(--accent)';
    }
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = 'ru-RU';
  recognition.interimResults = true;
  recognition.continuous = false;

  if (btn) {
    btn.style.background = 'var(--red)';
    btn.style.color = 'white';
  }

  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; i++) {
      transcript += event.results[i][0].transcript;
    }
    const input = document.getElementById('ai-input');
    if (input) input.value = transcript;
  };

  recognition.onerror = (event) => {
    console.warn('[VOICE]', event.error);
    toast('❌ Ошибка распознавания', 'error');
    _aiVoiceRecognition = null;
    if (btn) {
      btn.style.background = 'var(--bg-elev)';
      btn.style.color = 'var(--accent)';
    }
  };

  recognition.onend = () => {
    _aiVoiceRecognition = null;
    if (btn) {
      btn.style.background = 'var(--bg-elev)';
      btn.style.color = 'var(--accent)';
    }
    // Автоотправка, если есть текст
    const input = document.getElementById('ai-input');
    if (input && input.value.trim()) {
      setTimeout(sendAiMessage, 300);
    }
  };

  recognition.start();
  _aiVoiceRecognition = recognition;
}

// 🌍 ПЕРЕВОД СООБЩЕНИЙ — с поддержкой языков
// ============================================================
async function translateMessage(msgId, btn) {
  const msgEl = document.getElementById(msgId);
  const transEl = document.getElementById(msgId + '_translated');

  if (!msgEl || !transEl) return;

  // Если уже переведено — скрываем
  if (transEl.style.display === 'block') {
    transEl.style.display = 'none';
    btn.textContent = btn.textContent.replace('Скрыть', 'Перевести');
    return;
  }

  // Если уже есть текст перевода — просто показываем
  if (transEl.dataset.loaded === '1') {
    transEl.style.display = 'block';
    btn.textContent = btn.textContent.replace('Перевести', 'Скрыть');
    return;
  }

  const text = btn.dataset.text || msgEl.textContent;
  const targetLang = btn.dataset.lang || 'ru';

  if (!text.trim()) {
    toast('❌ Пустое сообщение', 'error');
    return;
  }

  const langNames = { 'ru': 'Русский', 'tj': 'Таджикский', 'en': 'English' };

  const originalText = btn.textContent;
  btn.disabled = true;
  btn.textContent = '⏳ Перевожу...';

  try {
    const data = await pubPost('/api/ai/translate', {
      text: text,
      target_lang: targetLang
    });

    if (!data.success || !data.translated) {
      btn.disabled = false;
      btn.textContent = originalText;
      toast('❌ ' + (data.error || 'Не удалось перевести'), 'error');
      return;
    }

    transEl.innerHTML = `🌍 <b>${langNames[targetLang]}:</b><br>` + esc(data.translated).replace(/\n/g, '<br>');
    transEl.style.display = 'block';
    transEl.dataset.loaded = '1';
    btn.textContent = '🌍 Скрыть перевод';
    btn.disabled = false;
    vibrate(20);

  } catch (e) {
    btn.disabled = false;
    btn.textContent = originalText;
    toast('❌ Ошибка: ' + e.message, 'error');
  }
}

// 👥 ПОХОЖИЕ ПОЛЬЗОВАТЕЛИ
// ============================================================
async function showSimilarUsers(userId) {
  const u = getTelegramUser();
  if (!u) { toast('Откройте через Telegram', 'error'); return; }

  vibrate();

  showModal(`
    <div class="modal-title">👥 Похожие пользователи</div>
    <div class="modal-desc">Марыям ищет людей с похожими интересами...</div>
    <div style="text-align:center;padding:30px 0;">
      <div style="width:60px;height:60px;margin:0 auto 20px;border-radius:50%;background:linear-gradient(135deg,#0a84ff,#bf5af2);display:flex;align-items:center;justify-content:center;font-size:28px;animation:pulse 1.5s ease-in-out infinite;">👥</div>
      <div class="loading-bar" style="margin:0 auto;"></div>
      <div style="font-size:13px;color:var(--text-mute);margin-top:14px;">Ищу совпадения...</div>
    </div>
  `);

  try {
    const data = await pubPost('/api/ai/similar_users', { user_id: userId, limit: 15 });

    if (!data.success) {
      closeModal();
      showModal(`
        <div class="modal-title">❌ Ошибка</div>
        <div class="modal-desc">${esc(data.error || 'Не удалось найти')}</div>
        <button class="btn secondary" onclick="closeModal()">Закрыть</button>
      `);
      return;
    }

    const users = data.users || [];

    if (!users.length) {
      closeModal();
      showModal(`
        <div class="modal-title">👥 Похожие пользователи</div>
        <div class="modal-desc">Пока никого не найдено</div>
        <button class="btn secondary" onclick="closeModal()">Закрыть</button>
      `);
      return;
    }

    closeModal();
    vibrate(50);
    showSimilarUsersModal(users, userId);

  } catch (e) {
    closeModal();
    showModal(`
      <div class="modal-title">❌ Ошибка сети</div>
      <div class="modal-desc">${esc(e.message)}</div>
      <button class="btn secondary" onclick="closeModal()">Закрыть</button>
    `);
  }
}

function showSimilarUsersModal(users, targetId) {
  const rows = users.map((usr, idx) => {
    const name = `${usr.first_name} ${usr.last_name}`.trim() || `Пользователь ${usr.user_id}`;
    const uname = usr.username ? `@${usr.username}` : '';
    const profileLink = usr.username ? `https://t.me/${usr.username}` : `tg://user?id=${usr.user_id}`;
    const scoreColor = usr.similarity >= 70 ? 'var(--green)' :
                       usr.similarity >= 40 ? 'var(--orange)' : 'var(--text-mute)';
    const wordsHtml = usr.common_words.length
      ? usr.common_words.slice(0, 3).map(w => `<span style="background:rgba(0,122,255,0.12);color:var(--accent);padding:2px 8px;border-radius:6px;font-size:11px;">${esc(w)}</span>`).join(' ')
      : '<span style="font-size:11px;color:var(--text-mute);">нет общих слов</span>';

    return `
      <div style="background:var(--bg-elev);border-radius:12px;padding:12px 14px;margin-bottom:8px;border-left:3px solid ${scoreColor};">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="flex:1;min-width:0;">
            <div style="font-size:14px;font-weight:700;color:var(--text);word-break:break-word;">${esc(name)}</div>
            <div style="font-size:11px;color:var(--text-mute);margin-top:2px;">
              ${uname ? esc(uname) + ' · ' : ''}ID: ${usr.user_id}
            </div>
          </div>
          <div style="text-align:right;flex-shrink:0;">
            <div style="font-size:18px;font-weight:700;color:${scoreColor};">${usr.similarity}%</div>
            <div style="font-size:9px;color:var(--text-mute);text-transform:uppercase;">схожесть</div>
          </div>
        </div>
        <div style="font-size:11px;color:var(--text-mute);margin-bottom:6px;">
          💬 ${usr.common_chats} общих чатов
        </div>
        <div style="margin-bottom:8px;">${wordsHtml}</div>
        <a href="${esc(profileLink)}" target="_blank" style="display:inline-block;font-size:11px;color:var(--accent);text-decoration:none;background:rgba(0,122,255,0.1);padding:5px 12px;border-radius:8px;font-weight:600;">👤 Открыть профиль</a>
      </div>
    `;
  }).join('');

  showModal(`
    <div class="modal-title">👥 Похожие пользователи</div>
    <div class="modal-desc" style="margin-bottom:16px;">Найдено ${users.length} совпадений</div>
    <div style="max-height:60vh;overflow-y:auto;margin-bottom:12px;">
      ${rows}
    </div>
    <button class="btn secondary" onclick="closeModal()">Закрыть</button>
  `);
}

async function selectTranslateLang(lang, userId) {
  _translateTargetLang = lang;

  const langNames = { 'ru': '🇷🇺 Русский', 'tj': '🇹🇯 Таджикский', 'en': '🇬🇧 English' };
  vibrate(30);

  // Загружаем сообщения
  closeModal();
  showModal(`
    <div class="modal-title">${langNames[lang]}</div>
    <div class="modal-desc">Загружаю сообщения...</div>
    <div style="text-align:center;padding:20px 0;">
      <div class="loading-bar" style="margin:0 auto;"></div>
    </div>
  `);

  try {
    const data = await apiGetUser(userId, 'all', 30);
    const comments = data.comments || [];

    if (!comments.length) {
      closeModal();
      showModal(`
        <div class="modal-title">🌍 Перевод</div>
        <div class="modal-desc">У пользователя нет сообщений для перевода</div>
        <button class="btn secondary" onclick="closeModal()">Закрыть</button>
      `);
      return;
    }

    // Показываем сообщения с кнопками перевода
    const rows = comments.slice(0, 10).map((c, idx) => {
      const msgId = 'tr_' + idx + '_' + Date.now();
      const textForAttr = esc(c.text || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
      const text = esc((c.text || '').substring(0, 150));
      const date = (c.date || '').slice(0, 16);
      return `
        <div style="background:var(--bg-elev);border-radius:12px;padding:10px 12px;margin-bottom:8px;">
          <div style="font-size:11px;color:var(--text-mute);margin-bottom:6px;">
            ${esc(c.chat || '—')} · ${esc(date)}
          </div>
          <div id="${msgId}" style="font-size:13px;color:var(--text);line-height:1.4;margin-bottom:8px;">
            ${text}
          </div>
          <div id="${msgId}_translated" style="display:none;margin-bottom:8px;padding:8px 10px;background:rgba(52,199,89,0.1);border-left:3px solid var(--green);border-radius:6px;font-size:13px;color:var(--text);"></div>
          <button onclick="translateMessage('${msgId}', this)" data-text="${textForAttr}" data-lang="${lang}" style="display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--green);background:rgba(52,199,89,0.12);border:1px solid rgba(52,199,89,0.3);padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;">🌍 Перевести на ${langNames[lang].split(' ')[1]}</button>
        </div>
      `;
    }).join('');

    closeModal();
    showModal(`
      <div class="modal-title">🌍 ${langNames[lang]}</div>
      <div class="modal-desc" style="margin-bottom:16px;">Нажмите кнопку под сообщением</div>
      <div style="max-height:60vh;overflow-y:auto;margin-bottom:12px;">
        ${rows}
      </div>
      <button class="btn secondary" onclick="closeModal()">Закрыть</button>
    `);

  } catch (e) {
    closeModal();
    showModal(`
      <div class="modal-title">❌ Ошибка</div>
      <div class="modal-desc">${esc(e.message)}</div>
      <button class="btn secondary" onclick="closeModal()">Закрыть</button>
    `);
  }
}
